<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Electrofelec">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<title>Electrofelec Fichajes</title>
<style>
:root{--g:#4cff41;--g2:#98ff91;--bg:#050505;--panel:#0c0c0c;--card:#111;--line:#242424;--line2:#343434;--text:#f7f7f7;--muted:#8b8b8b;--red:#ff6b6b;--blue:#7cc8ff;--yellow:#ffe274;--safeB:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}body{padding-top:env(safe-area-inset-top);overscroll-behavior-y:none}.hidden{display:none!important}
.shell{max-width:680px;margin:0 auto;padding:0 14px calc(92px + var(--safeB))}.topbar{height:72px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #171717;margin-bottom:15px}.brand{display:flex;align-items:center;gap:11px;min-width:0}.brandIcon{width:42px;height:42px;border-radius:13px;background:#0b190a;border:1px solid #2d7e28;display:grid;place-items:center;box-shadow:0 0 18px #4cff4120;overflow:hidden}.brandIcon img{width:34px;height:34px}.brandText{min-width:0}.brandText strong{display:block;font-size:16px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brandText span{font-size:11px;color:var(--muted)}.sync{font-size:10px;color:var(--g);border:1px solid #245c20;background:#0c1d0b;padding:5px 8px;border-radius:999px;white-space:nowrap}
.card{background:linear-gradient(180deg,#121212,#0e0e0e);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:13px;box-shadow:0 8px 30px #00000028}.cardTitle{font-weight:800;font-size:17px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:4px}.sectionHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.accent{color:var(--g)}
.loginWrap{padding-top:7vh}.loginLogo{width:82px;height:82px;margin:0 auto 18px;border-radius:25px;background:#0a1809;border:1px solid #2c7327;display:grid;place-items:center;box-shadow:0 0 34px #4cff4125}.loginLogo img{width:67px;height:67px}.loginTitle{text-align:center;font-size:24px;font-weight:900;margin-bottom:4px}.loginSub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:22px}
label{display:block;color:#aaa;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.35px;margin:13px 0 6px}.field,input,select,textarea{width:100%;border:1px solid #303030;border-radius:12px;background:#080808;color:#fff;font-size:16px;outline:none;padding:13px 12px;appearance:none}input:focus,select:focus,textarea:focus{border-color:#397d35;box-shadow:0 0 0 2px #4cff4110}textarea{min-height:72px;resize:none}.btn{width:100%;border:0;border-radius:13px;padding:14px 15px;font-size:15px;font-weight:900;background:var(--g);color:#071006}.btn:active{transform:scale(.99)}.btn.secondary{background:#191919;color:#eee;border:1px solid #333}.btn.danger{background:#241010;color:#ff9494;border:1px solid #522020}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.msg{font-size:12px;margin-top:10px;min-height:16px}.error{color:#ff8585}.ok{color:var(--g)}
.dateHero{display:flex;align-items:center;justify-content:space-between;gap:10px}.dateHero .big{font-size:24px;font-weight:900;line-height:1.05}.dateHero .small{font-size:12px;color:var(--muted);text-transform:capitalize;margin-top:5px}.todayBadge{min-width:54px;height:54px;border-radius:16px;background:#0e210c;border:1px solid #2a7625;display:grid;place-items:center;color:var(--g);font-weight:900;font-size:20px}
.hourGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:13px}.hourBox{background:#090909;border:1px solid #272727;border-radius:15px;padding:11px}.hourLabel{font-size:10px;color:#8f8f8f;text-transform:uppercase;font-weight:800;letter-spacing:.35px}.hourValue{font-size:25px;font-weight:900;margin:8px 0;color:#fff}.hourValue span{font-size:12px;color:#777;font-weight:600}.stepper{display:grid;grid-template-columns:42px 1fr 42px;gap:6px;align-items:center}.stepper button{height:38px;border:1px solid #303030;background:#161616;color:#fff;border-radius:10px;font-size:22px}.stepper input{text-align:center;padding:8px 4px;height:38px;font-size:15px;font-weight:800}.hourBox.extra .hourValue,.hourBox.extra input{color:var(--g)}.hourBox.fest .hourValue,.hourBox.fest input{color:var(--blue)}.hourBox.personal .hourValue,.hourBox.personal input{color:var(--yellow)}
.saveRow{display:grid;grid-template-columns:1.6fr 1fr;gap:9px;margin-top:14px}.monthNav{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px}.circleBtn{height:42px;border-radius:12px;border:1px solid #303030;background:#151515;color:#fff;font-size:22px}.monthName{text-align:center;font-size:17px;font-weight:900;text-transform:capitalize}.payrollPeriod{text-align:center;color:#999;font-size:11px;margin:7px 0 12px}.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.total{background:#090909;border:1px solid #252525;border-radius:13px;padding:11px 9px}.total span{display:block;color:#777;font-size:9px;font-weight:800;text-transform:uppercase}.total b{display:block;font-size:20px;margin-top:5px}.total.extra b{color:var(--g)}.total.fest b{color:var(--blue)}
.dayRow{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:11px 2px;border-bottom:1px solid #202020}.dayRow:last-child{border-bottom:0}.dayNum{width:42px;height:42px;border-radius:12px;background:#0a0a0a;border:1px solid #292929;display:grid;place-items:center;font-weight:900}.dayNum .dn{font-size:16px;line-height:1}.dayNum .dw{font-size:8px;color:#777;text-transform:uppercase;margin-top:2px}.dayMain{min-width:0}.dayMain strong{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dayMain .mini{font-size:10px;color:#777;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chips{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}.chip{font-size:9px;padding:4px 6px;border-radius:999px;border:1px solid #303030;background:#161616;color:#aaa}.chip.g{color:var(--g);border-color:#285425}.chip.b{color:var(--blue);border-color:#23465d}.chip.y{color:var(--yellow);border-color:#5e5424}
.calendarWeek{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px}.dow{text-align:center;color:#686868;font-size:9px;font-weight:800;padding:5px 0}.calday{aspect-ratio:1;border:1px solid #242424;background:#090909;border-radius:11px;color:#ccc;display:flex;align-items:center;justify-content:center;font-size:13px;position:relative}.calday.has:after{content:"";position:absolute;width:5px;height:5px;background:var(--g);border-radius:50%;bottom:5px}.calday.today{border-color:#2f7d2a;color:var(--g);font-weight:900}.calday.selected{background:#153012;border-color:var(--g);color:#fff}.calday.blank{visibility:hidden}
.summaryHead,.summaryLine{display:grid;grid-template-columns:1.35fr repeat(3,.7fr);gap:5px;align-items:center}.summaryHead{font-size:9px;color:#666;text-transform:uppercase;padding:7px 0}.summaryLine{font-size:11px;padding:11px 0;border-top:1px solid #202020}.summaryLine span:not(:first-child),.summaryLine b{text-align:right}.summaryLine b{color:var(--g)}.profileLine{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #202020;font-size:13px}.profileLine span{color:#888}.profileLine b{text-align:right}.employeeLine{padding:12px 0;border-bottom:1px solid #202020}.employeeLine:last-child{border-bottom:0}.employeeName{font-size:13px;font-weight:800}.employeeStats{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;font-size:10px;color:#888}.employeeStats b{color:#ddd}
.bottomNav{position:fixed;left:0;right:0;bottom:0;z-index:99;background:#080808f5;backdrop-filter:blur(16px);border-top:1px solid #242424;padding:7px 5px calc(7px + var(--safeB));display:flex;justify-content:center}.bottomInner{width:min(680px,100%);display:flex}.navBtn{flex:1;min-width:0;border:0;background:none;color:#6f6f6f;padding:4px 1px;font-size:9px;font-weight:700}.navIcon{display:block;font-size:19px;line-height:22px;filter:grayscale(1);opacity:.75}.navBtn.active{color:var(--g)}.navBtn.active .navIcon{filter:none;opacity:1}.loading{padding:24px;text-align:center;color:#777;font-size:12px}.empty{padding:28px 10px;text-align:center;color:#666;font-size:12px}
@media(max-width:380px){.shell{padding-left:10px;padding-right:10px}.hourGrid{gap:7px}.hourBox{padding:9px}.totals{gap:6px}.total b{font-size:18px}.navBtn{font-size:8px}.navIcon{font-size:17px}}
</style>
</head>
<body>
<div class="shell">
  <div id="appTop" class="topbar hidden"><div class="brand"><div class="brandIcon"><img src="./icon.svg" alt="E"></div><div class="brandText"><strong>Electrofelec System</strong><span id="who">Registro de horas</span></div></div><div class="sync">● ONLINE</div></div>

  <section id="login" class="loginWrap">
    <div class="loginLogo"><img src="./icon.svg" alt="Electrofelec"></div><div class="loginTitle">Electrofelec</div><div class="loginSub">Registro interno de horas</div>
    <div class="card"><label>Usuario</label><input id="username" autocapitalize="none" autocomplete="username" placeholder="Usuario"><label>PIN</label><input id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password" placeholder="••••••"><button class="btn" id="loginBtn" style="margin-top:16px">ENTRAR</button><div id="loginMsg" class="msg"></div></div>
  </section>

  <section id="changePin" class="loginWrap hidden"><div class="loginLogo"><img src="./icon.svg" alt="Electrofelec"></div><div class="loginTitle">Nuevo PIN</div><div class="loginSub">Crea un PIN personal de 6 cifras</div><div class="card"><label>PIN actual</label><input id="oldPin" type="password" inputmode="numeric" maxlength="6"><label>PIN nuevo</label><input id="newPin" type="password" inputmode="numeric" maxlength="6"><button class="btn" id="changeBtn" style="margin-top:16px">GUARDAR PIN</button><div id="pinMsg" class="msg"></div></div></section>

  <main id="app" class="hidden">
    <section id="tabToday"><div class="card"><div class="dateHero"><div><div class="big">Hoy</div><div id="todayDate" class="small"></div></div><div id="todayBadge" class="todayBadge"></div></div><div id="todayForm"></div></div></section>

    <section id="tabMonth" class="hidden"><div class="card"><div class="monthNav"><button id="prevMonth" class="circleBtn">‹</button><div id="monthLabel" class="monthName"></div><button id="nextMonth" class="circleBtn">›</button></div><div id="monthPeriod" class="payrollPeriod"></div><div id="monthStats" class="totals"></div><div id="monthList"></div></div></section>

    <section id="tabCalendar" class="hidden"><div class="card"><div class="monthNav"><button id="prevCal" class="circleBtn">‹</button><div id="calLabel" class="monthName"></div><button id="nextCal" class="circleBtn">›</button></div><div class="calendarWeek"><div class="dow">L</div><div class="dow">M</div><div class="dow">X</div><div class="dow">J</div><div class="dow">V</div><div class="dow">S</div><div class="dow">D</div></div><div id="calendarGrid" class="calendarWeek"></div></div><div id="calendarEditor" class="card hidden"><div class="sectionHead"><div><h2 id="selectedDateTitle" class="cardTitle"></h2><div class="sub">Editar jornada</div></div></div><div id="calendarForm"></div></div></section>

    <section id="tabSummary" class="hidden"><div class="card"><div class="sectionHead"><div><h2 class="cardTitle">Resumen</h2><div id="yearLabel" class="sub"></div></div></div><div id="annualStats" class="totals"></div><div class="summaryHead"><span>Periodo</span><span>Normal</span><span>Extra</span><span>Fest.</span></div><div id="summaryRows"></div><div id="summaryMsg" class="msg"></div></div></section>

    <section id="tabProfile" class="hidden"><div class="card"><div class="sectionHead"><div><h2 class="cardTitle">Perfil</h2><div class="sub">Datos del trabajador</div></div></div><div id="profile"></div><button class="btn danger" id="logoutBtn" style="margin-top:18px">CERRAR SESIÓN</button></div></section>

    <section id="tabCompany" class="hidden"><div class="card"><div class="sectionHead"><div><h2 class="cardTitle">Empresa</h2><div class="sub">Resumen de nómina</div></div></div><div id="companyPeriod" class="payrollPeriod"></div><div id="companyList"></div><div id="companyMsg" class="msg"></div></div></section>
  </main>
</div>

<nav id="nav" class="bottomNav hidden"><div class="bottomInner"><button class="navBtn active" data-tab="Today"><span class="navIcon">⌂</span>HOY</button><button class="navBtn" data-tab="Month"><span class="navIcon">▤</span>MES</button><button class="navBtn" data-tab="Calendar"><span class="navIcon">▦</span>CALENDARIO</button><button class="navBtn" data-tab="Summary"><span class="navIcon">∑</span>RESUMEN</button><button class="navBtn" data-tab="Profile"><span class="navIcon">●</span>PERFIL</button><button id="companyNav" class="navBtn hidden" data-tab="Company"><span class="navIcon">▣</span>EMPRESA</button></div></nav>

<script>
(()=>{
const API='https://kbdmraxjfgtttopsyfuy.supabase.co/functions/v1/electrofelec-fichajes/api/';
let token=localStorage.getItem('efs_token')||'',me=null,mc=new Date(),cc=new Date(),monthEntries=[],calEntries=[];
const q=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>{n=Number(n||0);return Number.isInteger(n)?String(n):String(Math.round(n*100)/100)};
const n=x=>Number(x||0);
function setMsg(id,t,ok=false){const e=q(id);e.textContent=t||'';e.className='msg '+(t?(ok?'ok':'error'):'')}
async function api(path,body){try{const r=await fetch(API+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});const j=await r.json().catch(()=>({ok:false,error:'Respuesta no válida'}));if(!r.ok&&j.ok!==false)j.ok=false;return j}catch{return {ok:false,error:'Sin conexión. Inténtalo de nuevo.'}}}
function payrollBounds(y,m){return {start:new Date(y,m-1,21,12),end:new Date(y,m,20,12)}}
function periodText(a,b){return `${pad(a.getDate())}/${pad(a.getMonth()+1)} → ${pad(b.getDate())}/${pad(b.getMonth()+1)}`}
function dateLong(d){return d.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
function getField(root,f){return root.querySelector(`[data-f="${f}"]`)}
function step(root,f,delta){const el=getField(root,f);el.value=Math.max(0,Math.round((n(el.value)+delta)*100)/100);syncHourValues(root)}
function syncHourValues(root){['normal','extra','holiday','personal'].forEach(f=>{const v=root.querySelector(`[data-v="${f}"]`);if(v)v.innerHTML=`${fmt(getField(root,f)?.value)} <span>h</span>`})}
function hourBox(label,f,value,cls=''){return `<div class="hourBox ${cls}"><div class="hourLabel">${label}</div><div class="hourValue" data-v="${f}">${fmt(value)} <span>h</span></div><div class="stepper"><button type="button" data-step="${f}" data-d="-0.25">−</button><input data-f="${f}" type="number" step="0.25" min="0" value="${n(value)}"><button type="button" data-step="${f}" data-d="0.25">+</button></div></div>`}
function renderForm(root,date,entry={}){root.innerHTML=`<div class="hourGrid">${hourBox('Normales','normal',entry.normal,'')}${hourBox('Extra','extra',entry.extra,'extra')}${hourBox('Festivas','holiday',entry.holiday,'fest')}${hourBox('Personales','personal',entry.personal,'personal')}</div><label>Incidencia</label><select data-f="incident"><option value="">Ninguna</option><option value="vacation">Vacaciones</option><option value="sick_leave">Baja / IT</option><option value="absence">Ausencia</option><option value="personal">Personal</option></select><label>Obra / centro</label><input data-f="worksite" value="${esc(entry.worksite||'')}" placeholder="Obra o cliente"><label>Observaciones</label><textarea data-f="notes" placeholder="Observaciones">${esc(entry.notes||'')}</textarea><div class="saveRow"><button class="btn" data-action="save">GUARDAR</button><button class="btn secondary" data-action="clear">BORRAR</button></div><div class="msg" data-f="msg"></div>`;
 getField(root,'incident').value=entry.incident||'';
 root.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>step(root,b.dataset.step,n(b.dataset.d)));
 root.querySelectorAll('input[type=number]').forEach(x=>x.oninput=()=>syncHourValues(root));
 root.querySelector('[data-action=save]').onclick=()=>saveFromForm(root,date);
 root.querySelector('[data-action=clear]').onclick=()=>clearDate(root,date);
}
async function saveFromForm(root,date){const out=getField(root,'msg');out.textContent='Guardando…';out.className='msg';const r=await api('save',{p_session_token:token,p_work_date:date,p_normal:n(getField(root,'normal').value),p_extra:n(getField(root,'extra').value),p_holiday:n(getField(root,'holiday').value),p_personal:n(getField(root,'personal').value),p_worksite:getField(root,'worksite').value,p_incident:getField(root,'incident').value||null,p_notes:getField(root,'notes').value,p_employee_id:null});if(!r.ok){out.textContent=r.error||'No se pudo guardar';out.className='msg error';return}out.textContent='Guardado y sincronizado';out.className='msg ok';if(date===iso(new Date()))loadToday();}
async function clearDate(root,date){if(!confirm('¿Borrar los datos de este día?'))return;const out=getField(root,'msg');const r=await api('clear',{p_session_token:token,p_work_date:date,p_employee_id:null});if(!r.ok){out.textContent=r.error||'No se pudo borrar';out.className='msg error';return}renderForm(root,date,{});const m=getField(root,'msg');m.textContent='Día borrado';m.className='msg ok';}
function showApp(){q('login').classList.add('hidden');q('changePin').classList.add('hidden');q('app').classList.remove('hidden');q('appTop').classList.remove('hidden');q('nav').classList.remove('hidden');q('who').textContent=me.full_name||'Registro de horas';q('companyNav').classList.toggle('hidden',me.role!=='admin');q('profile').innerHTML=`<div class="profileLine"><span>Nombre</span><b>${esc(me.full_name)}</b></div><div class="profileLine"><span>Rol</span><b>${me.role==='admin'?'Administrador':'Trabajador'}</b></div><div class="profileLine"><span>Vacaciones anuales</span><b class="accent">${n(me.annual_vacation_days||30)} días</b></div><div class="profileLine"><span>Horas personales</span><b class="accent">${n(me.annual_personal_hours||12)} h</b></div>`;loadToday()}
async function boot(){if(!token)return;const r=await api('me',{p_session_token:token});if(!r.ok){localStorage.removeItem('efs_token');token='';return}me=r;showApp()}
q('loginBtn').onclick=async()=>{const u=q('username').value.trim(),p=q('pin').value.trim();if(!u||p.length!==6){setMsg('loginMsg','Introduce usuario y PIN de 6 cifras');return}q('loginBtn').textContent='ENTRANDO…';const r=await api('login',{p_username:u,p_pin:p});q('loginBtn').textContent='ENTRAR';if(!r.ok){setMsg('loginMsg',r.error||'No se pudo iniciar sesión');return}token=r.session_token;localStorage.setItem('efs_token',token);if(r.must_change_pin){q('login').classList.add('hidden');q('changePin').classList.remove('hidden');q('oldPin').value=p;return}const m=await api('me',{p_session_token:token});if(!m.ok){setMsg('loginMsg',m.error||'Error cargando perfil');return}me=m;showApp()}
q('changeBtn').onclick=async()=>{const o=q('oldPin').value.trim(),nn=q('newPin').value.trim();if(nn.length!==6){setMsg('pinMsg','El PIN nuevo debe tener 6 cifras');return}const r=await api('change-pin',{p_session_token:token,p_current_pin:o,p_new_pin:nn});if(!r.ok){setMsg('pinMsg',r.error||'No se pudo cambiar');return}me=await api('me',{p_session_token:token});showApp()}
async function loadToday(){const d=new Date(),s=iso(d);q('todayDate').textContent=dateLong(d);q('todayBadge').textContent=d.getDate();const r=await api('entries',{p_session_token:token,p_start_date:s,p_end_date:s,p_employee_id:null});if(!r.ok){q('todayForm').innerHTML=`<div class="error">${esc(r.error)}</div>`;return}renderForm(q('todayForm'),s,(r.entries||[])[0]||{})}
async function loadMonth(){q('monthLabel').textContent=mc.toLocaleDateString('es-ES',{month:'long',year:'numeric'});q('monthStats').innerHTML='<div class="loading" style="grid-column:1/-1">Cargando…</div>';q('monthList').innerHTML='';const naturalA=new Date(mc.getFullYear(),mc.getMonth(),1,12),naturalB=new Date(mc.getFullYear(),mc.getMonth()+1,0,12),pb=payrollBounds(mc.getFullYear(),mc.getMonth());q('monthPeriod').textContent='Nómina '+periodText(pb.start,pb.end);const [rn,rp]=await Promise.all([api('entries',{p_session_token:token,p_start_date:iso(naturalA),p_end_date:iso(naturalB),p_employee_id:null}),api('entries',{p_session_token:token,p_start_date:iso(pb.start),p_end_date:iso(pb.end),p_employee_id:null})]);if(!rn.ok||!rp.ok){q('monthStats').innerHTML='';q('monthList').innerHTML=`<div class="error">${esc((!rn.ok?rn.error:rp.error)||'Error cargando mes')}</div>`;return}monthEntries=rn.entries||[];let t={normal:0,extra:0,holiday:0};(rp.entries||[]).forEach(e=>{t.normal+=n(e.normal);t.extra+=n(e.extra);t.holiday+=n(e.holiday)});q('monthStats').innerHTML=`<div class="total"><span>Normal</span><b>${fmt(t.normal)} h</b></div><div class="total extra"><span>Extra</span><b>${fmt(t.extra)} h</b></div><div class="total fest"><span>Festivo</span><b>${fmt(t.holiday)} h</b></div>`;if(!monthEntries.length){q('monthList').innerHTML='<div class="empty">No hay registros en este mes</div>';return}q('monthList').innerHTML=monthEntries.map(e=>{const d=new Date(e.date+'T12:00:00'),chips=[];if(n(e.normal))chips.push(`<span class="chip">${fmt(e.normal)}N</span>`);if(n(e.extra))chips.push(`<span class="chip g">${fmt(e.extra)}E</span>`);if(n(e.holiday))chips.push(`<span class="chip b">${fmt(e.holiday)}F</span>`);if(n(e.personal))chips.push(`<span class="chip y">${fmt(e.personal)}P</span>`);if(e.incident==='vacation')chips.push('<span class="chip y">VC</span>');if(e.incident==='sick_leave')chips.push('<span class="chip">IT</span>');return `<div class="dayRow"><div class="dayNum"><div><div class="dn">${d.getDate()}</div><div class="dw">${d.toLocaleDateString('es-ES',{weekday:'short'}).replace('.','')}</div></div></div><div class="dayMain"><strong>${esc(e.worksite||'Sin obra')}</strong><div class="mini">${esc(e.notes||'')}</div></div><div class="chips">${chips.join('')}</div></div>`}).join('')}
q('prevMonth').onclick=()=>{mc=new Date(mc.getFullYear(),mc.getMonth()-1,1,12);loadMonth()};q('nextMonth').onclick=()=>{mc=new Date(mc.getFullYear(),mc.getMonth()+1,1,12);loadMonth()};
async function loadCalendar(){q('calLabel').textContent=cc.toLocaleDateString('es-ES',{month:'long',year:'numeric'});q('calendarEditor').classList.add('hidden');const a=new Date(cc.getFullYear(),cc.getMonth(),1,12),b=new Date(cc.getFullYear(),cc.getMonth()+1,0,12),r=await api('entries',{p_session_token:token,p_start_date:iso(a),p_end_date:iso(b),p_employee_id:null});if(!r.ok){q('calendarGrid').innerHTML=`<div class="error">${esc(r.error)}</div>`;return}calEntries=r.entries||[];const map=new Map(calEntries.map(x=>[x.date,x]));let html='',first=(a.getDay()+6)%7;for(let i=0;i<first;i++)html+='<div class="calday blank"></div>';for(let day=1;day<=b.getDate();day++){const d=new Date(cc.getFullYear(),cc.getMonth(),day,12),s=iso(d),has=map.has(s),today=s===iso(new Date());html+=`<button class="calday ${has?'has':''} ${today?'today':''}" data-date="${s}">${day}</button>`}q('calendarGrid').innerHTML=html;q('calendarGrid').querySelectorAll('[data-date]').forEach(btn=>btn.onclick=()=>selectCalendarDate(btn.dataset.date,map.get(btn.dataset.date)||{}))}
function selectCalendarDate(s,e){q('calendarGrid').querySelectorAll('.calday').forEach(x=>x.classList.toggle('selected',x.dataset.date===s));const d=new Date(s+'T12:00:00');q('selectedDateTitle').textContent=d.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});q('calendarEditor').classList.remove('hidden');renderForm(q('calendarForm'),s,e);setTimeout(()=>q('calendarEditor').scrollIntoView({behavior:'smooth',block:'start'}),50)}
q('prevCal').onclick=()=>{cc=new Date(cc.getFullYear(),cc.getMonth()-1,1,12);loadCalendar()};q('nextCal').onclick=()=>{cc=new Date(cc.getFullYear(),cc.getMonth()+1,1,12);loadCalendar()};
async function loadSummary(){const y=new Date().getFullYear();q('yearLabel').textContent='Nóminas '+y;q('annualStats').innerHTML='<div class="loading" style="grid-column:1/-1">Cargando…</div>';q('summaryRows').innerHTML='';const start=new Date(y-1,11,21,12),end=new Date(y,11,20,12),r=await api('entries',{p_session_token:token,p_start_date:iso(start),p_end_date:iso(end),p_employee_id:null});if(!r.ok){q('annualStats').innerHTML='';setMsg('summaryMsg',r.error||'Error cargando resumen');return}const buckets=Array.from({length:12},()=>({normal:0,extra:0,holiday:0}));(r.entries||[]).forEach(e=>{const d=new Date(e.date+'T12:00:00');let idx=d.getMonth();if(d.getDate()>=21)idx=(d.getMonth()+1)%12;if(d.getFullYear()===y-1&&idx!==0)return;buckets[idx].normal+=n(e.normal);buckets[idx].extra+=n(e.extra);buckets[idx].holiday+=n(e.holiday)});let all={normal:0,extra:0,holiday:0};buckets.forEach(x=>{all.normal+=x.normal;all.extra+=x.extra;all.holiday+=x.holiday});q('annualStats').innerHTML=`<div class="total"><span>Normal</span><b>${fmt(all.normal)} h</b></div><div class="total extra"><span>Extra</span><b>${fmt(all.extra)} h</b></div><div class="total fest"><span>Festivo</span><b>${fmt(all.holiday)} h</b></div>`;const names=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];q('summaryRows').innerHTML=buckets.map((x,i)=>`<div class="summaryLine"><span>${names[i]}</span><span>${fmt(x.normal)}</span><b>${fmt(x.extra)}</b><span>${fmt(x.holiday)}</span></div>`).join('');setMsg('summaryMsg','',true)}
async function loadCompany(){if(me.role!=='admin')return;const now=new Date(),pm=now.getDate()<=20?now.getMonth():now.getMonth()+1,py=pm>11?now.getFullYear()+1:now.getFullYear(),m=pm%12,pb=payrollBounds(py,m);q('companyPeriod').textContent='Periodo '+periodText(pb.start,pb.end);q('companyList').innerHTML='<div class="loading">Cargando empresa…</div>';const r=await api('admin/summary',{p_session_token:token,p_start_date:new Date(py,m,1,12).toISOString().slice(0,10),p_end_date:new Date(py,m+1,0,12).toISOString().slice(0,10)});if(!r.ok){q('companyList').innerHTML='';setMsg('companyMsg',r.error||'Error cargando empresa');return}q('companyList').innerHTML=(r.employees||[]).map(e=>`<div class="employeeLine"><div class="employeeName">${esc(e.full_name)}</div><div class="employeeStats"><span>Normal <b>${fmt(e.normal)}h</b></span><span>Extra <b class="accent">${fmt(e.extra)}h</b></span><span>Fest. <b>${fmt(e.holiday)}h</b></span><span>VC <b>${fmt(e.vacations)}d</b></span></div></div>`).join('')||'<div class="empty">Sin trabajadores</div>'}
function switchTab(tab){document.querySelectorAll('.navBtn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));['Today','Month','Calendar','Summary','Profile','Company'].forEach(t=>q('tab'+t).classList.toggle('hidden',t!==tab));window.scrollTo({top:0,behavior:'instant'});if(tab==='Today')loadToday();if(tab==='Month')loadMonth();if(tab==='Calendar')loadCalendar();if(tab==='Summary')loadSummary();if(tab==='Company')loadCompany()}
document.querySelectorAll('.navBtn').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
q('logoutBtn').onclick=async()=>{try{await api('logout',{p_session_token:token})}catch{}localStorage.removeItem('efs_token');location.reload()};
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
boot();
})();
</script>
