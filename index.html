<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Electrofelec">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<title>Electrofelec Fichajes</title>
<style>
:root{--g:#56ff4a;--bg:#050505;--card:#111;--line:#292929;--muted:#999;--red:#ff8b8b;--blue:#89c6ff;--yellow:#ffe36b}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);min-height:100vh}.wrap{max-width:760px;margin:auto;padding:18px 14px calc(96px + env(safe-area-inset-bottom))}.brand{display:flex;align-items:center;gap:12px;margin:6px 2px 20px}.logo{width:48px;height:48px;border:2px solid var(--g);border-radius:14px;display:grid;place-items:center;color:var(--g);font-weight:900;font-size:24px;box-shadow:0 0 18px #56ff4a22}.brand h1{font-size:20px;margin:0}.muted{color:var(--muted);font-size:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}.title{font-size:18px;margin:0 0 12px}.hidden{display:none!important}label{display:block;color:#bbb;font-size:13px;margin:12px 0 6px}input,select,textarea{width:100%;background:#090909;color:#fff;border:1px solid #333;border-radius:12px;padding:13px;font-size:16px;outline:none}input:focus,select:focus,textarea:focus{border-color:#4fa548}textarea{min-height:72px;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{width:100%;border:0;border-radius:13px;padding:13px 15px;font-weight:800;background:var(--g);color:#051005;font-size:15px}.btn.secondary{background:#222;color:#fff;border:1px solid #333}.btn.danger{background:#2b1111;color:#ff9a9a;border:1px solid #5c2222}.msg{margin-top:10px;font-size:14px}.error{color:var(--red)}.ok{color:var(--g)}.nav{position:fixed;left:0;right:0;bottom:0;background:#090909f5;border-top:1px solid #242424;padding:7px 8px calc(7px + env(safe-area-inset-bottom));display:flex;overflow-x:auto;z-index:50}.nav button{flex:1;min-width:68px;background:none;border:0;color:#888;padding:9px 3px;font-size:11px}.nav button.active{color:var(--g);font-weight:800}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#090909;border:1px solid #242424;border-radius:14px;padding:12px;min-width:0}.stat span{display:block;color:#aaa;font-size:11px}.stat b{display:block;color:var(--g);font-size:20px;margin-top:4px}.day{padding:12px 0;border-bottom:1px solid #222}.day:last-child{border-bottom:0}.daytop{display:flex;justify-content:space-between;gap:8px;font-weight:700}.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}.tag{font-size:12px;background:#202020;border:1px solid #303030;border-radius:999px;padding:5px 8px}.tag.vc{color:var(--yellow)}.tag.fest{color:var(--blue)}.monthhead{display:flex;align-items:center;gap:8px}.monthhead button{width:44px;height:40px;border-radius:10px;border:1px solid #333;background:#181818;color:#fff;font-size:18px}.monthhead .label{flex:1;text-align:center;font-weight:800;text-transform:capitalize}.pill{display:inline-block;border:1px solid #315f2e;background:#10220f;color:var(--g);padding:5px 9px;border-radius:999px;font-size:12px}.row{display:flex;align-items:center;gap:10px}.row>*{flex:1}.period{font-size:12px;color:#aaa;margin:11px 0 13px;text-align:center}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px}.dow{text-align:center;color:#888;font-size:11px;padding:5px 0}.calday{aspect-ratio:1;border:1px solid #272727;border-radius:10px;background:#0a0a0a;color:#ddd;display:flex;align-items:center;justify-content:center;font-size:13px;position:relative}.calday.has:after{content:"";position:absolute;width:5px;height:5px;border-radius:50%;background:var(--g);bottom:5px}.calday.today{border-color:var(--g);color:var(--g);font-weight:800}.calday.blank{visibility:hidden}.summaryRow{display:grid;grid-template-columns:1.25fr repeat(3,.75fr);gap:5px;align-items:center;padding:9px 0;border-bottom:1px solid #222;font-size:12px}.summaryRow.head{color:#888;font-size:10px}.summaryRow b{color:var(--g);text-align:right}.summaryRow span:not(:first-child){text-align:right}.editDate{font-weight:800;color:var(--g);text-transform:capitalize;margin-bottom:4px}@media(max-width:410px){.statgrid{grid-template-columns:1fr 1fr}.summaryRow{font-size:11px}.card{padding:14px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><div class="logo">E</div><div><h1>Electrofelec System</h1><div class="muted">Registro de horas</div></div></div>

  <section id="login" class="card">
    <h2 class="title">Acceso</h2>
    <label>Usuario</label><input id="username" autocapitalize="none" autocomplete="username">
    <label>PIN de 6 cifras</label><input id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password">
    <button class="btn" id="loginBtn" style="margin-top:14px">Entrar</button><div id="loginMsg" class="msg"></div>
  </section>

  <section id="changePin" class="card hidden">
    <h2 class="title">Cambia tu PIN inicial</h2><div class="muted">Crea un PIN nuevo de 6 cifras.</div>
    <label>PIN actual</label><input id="oldPin" type="password" inputmode="numeric" maxlength="6">
    <label>PIN nuevo</label><input id="newPin" type="password" inputmode="numeric" maxlength="6">
    <button class="btn" id="changeBtn" style="margin-top:14px">Guardar PIN</button><div id="pinMsg" class="msg"></div>
  </section>

  <main id="app" class="hidden">
    <div class="card"><div class="row"><div><div class="muted">Sesión iniciada</div><b id="who"></b></div><div style="text-align:right"><span class="pill">Sincronizado</span></div></div></div>

    <section id="tabToday"><div class="card"><h2 class="title">Hoy</h2><div id="todayDate" class="muted"></div><div id="todayForm"></div></div></section>

    <section id="tabMonth" class="hidden"><div class="card">
      <div class="monthhead"><button id="prevMonth">‹</button><div class="label" id="monthLabel"></div><button id="nextMonth">›</button></div>
      <div id="monthPeriod" class="period"></div><div id="monthStats" class="statgrid"></div><div id="monthList"></div>
    </div></section>

    <section id="tabCalendar" class="hidden"><div class="card">
      <div class="monthhead"><button id="prevCal">‹</button><div class="label" id="calLabel"></div><button id="nextCal">›</button></div>
      <div class="cal"><div class="dow">L</div><div class="dow">M</div><div class="dow">X</div><div class="dow">J</div><div class="dow">V</div><div class="dow">S</div><div class="dow">D</div></div>
      <div id="calendarGrid" class="cal"></div>
    </div><div id="calendarEditor" class="card hidden"><div id="selectedDateTitle" class="editDate"></div><div id="calendarForm"></div></div></section>

    <section id="tabSummary" class="hidden"><div class="card">
      <h2 class="title">Resumen de nómina</h2><div id="yearLabel" class="muted"></div><div id="annualStats" class="statgrid" style="margin-top:12px"></div>
      <div class="summaryRow head"><span>Periodo</span><span>Normal</span><span>Extra</span><span>Fest.</span></div><div id="summaryRows"></div><div id="summaryMsg" class="msg"></div>
    </div></section>

    <section id="tabProfile" class="hidden"><div class="card"><h2 class="title">Perfil</h2><div id="profile"></div><button class="btn danger" id="logoutBtn" style="margin-top:18px">Cerrar sesión</button></div></section>

    <section id="tabCompany" class="hidden"><div class="card"><h2 class="title">Empresa</h2><div class="muted">Resumen del periodo de nómina actual</div><div id="companyPeriod" class="period"></div><div id="companyList"></div><div id="companyMsg" class="msg"></div></div></section>
  </main>
</div>
<nav id="nav" class="nav hidden">
  <button data-tab="Today" class="active">Hoy</button><button data-tab="Month">Mes</button><button data-tab="Calendar">Calendario</button><button data-tab="Summary">Resumen</button><button data-tab="Profile">Perfil</button><button id="companyNav" data-tab="Company" class="hidden">Empresa</button>
</nav>
<script>
(()=>{
const API='https://kbdmraxjfgtttopsyfuy.supabase.co/functions/v1/electrofelec-fichajes/api/';
let token=localStorage.getItem('efs_token')||'',me=null,mc=new Date(),cc=new Date();
const q=id=>document.getElementById(id), pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>{n=Number(n||0);return Number.isInteger(n)?String(n):String(Math.round(n*100)/100)};
function msg(id,t,ok=false){q(id).textContent=t||'';q(id).className='msg '+(ok?'ok':'error')}
async function api(path,body){try{const r=await fetch(API+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});const j=await r.json().catch(()=>({ok:false,error:'Respuesta no válida'}));if(!r.ok&&j.ok!==false)j.ok=false;return j}catch(e){return {ok:false,error:'Sin conexión. Inténtalo de nuevo.'}}}
function payrollBounds(y,m){return {start:new Date(y,m-1,21),end:new Date(y,m,20)}} // m 0-based selected payroll month
function monthName(d){return d.toLocaleDateString('es-ES',{month:'long',year:'numeric'})}
function renderForm(target,date,entry={}){target.innerHTML=`<div class="grid2"><div><label>Horas normales</label><input data-f="normal" type="number" step="0.25" min="0" value="${Number(entry.normal||0)}"></div><div><label>Horas extra</label><input data-f="extra" type="number" step="0.25" min="0" value="${Number(entry.extra||0)}"></div></div><div class="grid2"><div><label>Horas festivas</label><input data-f="holiday" type="number" step="0.25" min="0" value="${Number(entry.holiday||0)}"></div><div><label>Horas personales</label><input data-f="personal" type="number" step="0.25" min="0" value="${Number(entry.personal||0)}"></div></div><label>Incidencia</label><select data-f="incident"><option value="">Ninguna</option><option value="vacation">Vacaciones</option><option value="sick_leave">Baja / IT</option><option value="absence">Ausencia</option><option value="personal">Personal</option></select><label>Obra / centro</label><input data-f="worksite" value="${esc(entry.worksite||'')}"><label>Observaciones</label><textarea data-f="notes">${esc(entry.notes||'')}</textarea><div class="grid2" style="margin-top:14px"><button class="btn" data-action="save">Guardar</button><button class="btn secondary" data-action="clear">Borrar día</button></div><div class="msg" data-f="msg"></div>`;
 const inc=target.querySelector('[data-f=incident]');inc.value=entry.incident||'';
 target.querySelector('[data-action=save]').onclick=()=>saveFromForm(target,date);
 target.querySelector('[data-action=clear]').onclick=()=>clearDate(target,date);
}
async function saveFromForm(root,date){const v=f=>root.querySelector(`[data-f=${f}]`);const out=root.querySelector('[data-f=msg]');out.textContent='Guardando…';out.className='msg';const r=await api('save',{p_session_token:token,p_work_date:date,p_normal:Number(v('normal').value||0),p_extra:Number(v('extra').value||0),p_holiday:Number(v('holiday').value||0),p_personal:Number(v('personal').value||0),p_worksite:v('worksite').value,p_incident:v('incident').value||null,p_notes:v('notes').value,p_employee_id:null});if(!r.ok){out.textContent=r.error||'No se pudo guardar';out.className='msg error';return}out.textContent='Guardado y sincronizado';out.className='msg ok';if(date===iso(new Date()))loadToday();}
async function clearDate(root,date){if(!confirm('¿Borrar las horas de este día?'))return;const out=root.querySelector('[data-f=msg]');const r=await api('clear',{p_session_token:token,p_work_date:date,p_employee_id:null});if(!r.ok){out.textContent=r.error||'No se pudo borrar';out.className='msg error';return}renderForm(root,date,{});root.querySelector('[data-f=msg]').textContent='Día borrado';root.querySelector('[data-f=msg]').className='msg ok';}
function showApp(){q('login').classList.add('hidden');q('changePin').classList.add('hidden');q('app').classList.remove('hidden');q('nav').classList.remove('hidden');q('who').textContent=me.full_name||'';q('companyNav').classList.toggle('hidden',me.role!=='admin');q('profile').innerHTML=`<p><b>${esc(me.full_name)}</b></p><p class="muted">Rol: ${esc(me.role)}</p><p>Vacaciones anuales: <b style="color:var(--g)">${Number(me.annual_vacation_days||30)}</b></p><p>Horas personales anuales: <b style="color:var(--g)">${Number(me.annual_personal_hours||12)}</b></p>`;loadToday()}
async function boot(){if(!token)return;const r=await api('me',{p_session_token:token});if(!r.ok){localStorage.removeItem('efs_token');token='';return}me=r;showApp()}
q('loginBtn').onclick=async()=>{const u=q('username').value.trim(),p=q('pin').value.trim();if(!u||p.length!==6){msg('loginMsg','Introduce usuario y PIN de 6 cifras');return}msg('loginMsg','Entrando…',true);const r=await api('login',{p_username:u,p_pin:p});if(!r.ok){msg('loginMsg',r.error||'No se pudo iniciar sesión');return}token=r.session_token;localStorage.setItem('efs_token',token);if(r.must_change_pin){q('login').classList.add('hidden');q('changePin').classList.remove('hidden');q('oldPin').value=p;return}const m=await api('me',{p_session_token:token});if(!m.ok){msg('loginMsg',m.error||'Error cargando perfil');return}me=m;showApp()};
q('changeBtn').onclick=async()=>{const n=q('newPin').value.trim(),o=q('oldPin').value.trim();if(n.length!==6){msg('pinMsg','El PIN nuevo debe tener 6 cifras');return}const r=await api('change-pin',{p_session_token:token,p_current_pin:o,p_new_pin:n});if(!r.ok){msg('pinMsg',r.error||'No se pudo cambiar');return}me=await api('me',{p_session_token:token});showApp()};
async function loadEntry(date){const r=await api('entries',{p_session_token:token,p_start_date:date,p_end_date:date,p_employee_id:null});return r.ok?(r.entries||[])[0]||{}:{} }
async function loadToday(){const d=iso(new Date());q('todayDate').textContent=new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'});const e=await loadEntry(d);renderForm(q('todayForm'),d,e)}
async function loadMonth(){const a=new Date(mc.getFullYear(),mc.getMonth(),1),b=new Date(mc.getFullYear(),mc.getMonth()+1,0),pb=payrollBounds(mc.getFullYear(),mc.getMonth());q('monthLabel').textContent=monthName(mc);q('monthPeriod').textContent=`Totales nómina: ${pad(pb.start.getDate())}/${pad(pb.start.getMonth()+1)} → ${pad(pb.end.getDate())}/${pad(pb.end.getMonth()+1)}`;q('monthList').innerHTML='<div class="muted" style="padding:18px;text-align:center">Cargando…</div>';
 const [nat,pay]=await Promise.all([api('entries',{p_session_token:token,p_start_date:iso(a),p_end_date:iso(b),p_employee_id:null}),api('entries',{p_session_token:token,p_start_date:iso(pb.start),p_end_date:iso(pb.end),p_employee_id:null})]);
 if(!nat.ok||!pay.ok){q('monthList').innerHTML='<div class="error">No se pudo cargar el mes</div>';return}
 let s={n:0,e:0,h:0};(pay.entries||[]).forEach(x=>{s.n+=+x.normal||0;s.e+=+x.extra||0;s.h+=+x.holiday||0});q('monthStats').innerHTML=`<div class="stat"><span>NORMAL</span><b>${fmt(s.n)} h</b></div><div class="stat"><span>EXTRA</span><b>${fmt(s.e)} h</b></div><div class="stat"><span>FEST.</span><b>${fmt(s.h)} h</b></div>`;
 const es=nat.entries||[];q('monthList').innerHTML=es.length?es.map(e=>{let t=[];if(+e.normal)t.push(`<span class="tag">Normal ${fmt(e.normal)} h</span>`);if(+e.extra)t.push(`<span class="tag">Extra ${fmt(e.extra)} h</span>`);if(+e.holiday)t.push(`<span class="tag fest">Festivo ${fmt(e.holiday)} h</span>`);if(+e.personal)t.push(`<span class="tag">Personal ${fmt(e.personal)} h</span>`);if(e.incident==='vacation')t.push('<span class="tag vc">VC</span>');if(e.incident==='sick_leave')t.push('<span class="tag">Baja</span>');return `<div class="day"><div class="daytop"><span>${new Date(e.date+'T12:00:00').toLocaleDateString('es-ES',{weekday:'short',day:'2-digit',month:'2-digit'})}</span><span class="muted">${esc(e.worksite)}</span></div><div class="tags">${t.join('')}</div>${e.notes?`<div class="muted" style="margin-top:7px">${esc(e.notes)}</div>`:''}</div>`}).join(''):'<div class="muted" style="padding:20px;text-align:center">No hay registros este mes</div>';
}
q('prevMonth').onclick=()=>{mc=new Date(mc.getFullYear(),mc.getMonth()-1,1);loadMonth()};q('nextMonth').onclick=()=>{mc=new Date(mc.getFullYear(),mc.getMonth()+1,1);loadMonth()};
async function loadCalendar(){const a=new Date(cc.getFullYear(),cc.getMonth(),1),b=new Date(cc.getFullYear(),cc.getMonth()+1,0);q('calLabel').textContent=monthName(cc);q('calendarEditor').classList.add('hidden');const r=await api('entries',{p_session_token:token,p_start_date:iso(a),p_end_date:iso(b),p_employee_id:null});const map=new Map((r.entries||[]).map(e=>[e.date,e]));let html='';const offset=(a.getDay()+6)%7;for(let i=0;i<offset;i++)html+='<div class="calday blank"></div>';for(let d=1;d<=b.getDate();d++){const dt=new Date(cc.getFullYear(),cc.getMonth(),d),ds=iso(dt),has=map.has(ds),tod=ds===iso(new Date());html+=`<button class="calday ${has?'has':''} ${tod?'today':''}" data-date="${ds}">${d}</button>`}q('calendarGrid').innerHTML=html;q('calendarGrid').querySelectorAll('[data-date]').forEach(btn=>btn.onclick=async()=>{const ds=btn.dataset.date,e=map.get(ds)||{};q('selectedDateTitle').textContent=new Date(ds+'T12:00:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'});renderForm(q('calendarForm'),ds,e);q('calendarEditor').classList.remove('hidden');q('calendarEditor').scrollIntoView({behavior:'smooth',block:'start'})})}
q('prevCal').onclick=()=>{cc=new Date(cc.getFullYear(),cc.getMonth()-1,1);loadCalendar()};q('nextCal').onclick=()=>{cc=new Date(cc.getFullYear(),cc.getMonth()+1,1);loadCalendar()};
async function loadSummary(){const y=new Date().getFullYear(),start=new Date(y-1,11,21),end=new Date(y,11,20);q('yearLabel').textContent=`Nóminas ${y} · cada mes del 21 anterior al 20`;q('summaryMsg').textContent='Cargando…';const r=await api('entries',{p_session_token:token,p_start_date:iso(start),p_end_date:iso(end),p_employee_id:null});if(!r.ok){msg('summaryMsg',r.error||'Error cargando resumen');return}const months=Array.from({length:12},()=>({n:0,e:0,h:0,p:0,v:0,s:0}));(r.entries||[]).forEach(x=>{const d=new Date(x.date+'T12:00:00');let m=d.getMonth();if(d.getDate()>=21)m=(m+1)%12;months[m].n+=+x.normal||0;months[m].e+=+x.extra||0;months[m].h+=+x.holiday||0;months[m].p+=+x.personal||0;if(x.incident==='vacation')months[m].v++;if(x.incident==='sick_leave')months[m].s++});let a={n:0,e:0,h:0,p:0,v:0,s:0};months.forEach(m=>Object.keys(a).forEach(k=>a[k]+=m[k]));q('annualStats').innerHTML=`<div class="stat"><span>NORMAL</span><b>${fmt(a.n)} h</b></div><div class="stat"><span>EXTRA</span><b>${fmt(a.e)} h</b></div><div class="stat"><span>FEST.</span><b>${fmt(a.h)} h</b></div><div class="stat"><span>VACACIONES</span><b>${a.v} d</b></div><div class="stat"><span>PERSONALES</span><b>${fmt(a.p)} h</b></div><div class="stat"><span>BAJA / IT</span><b>${a.s} d</b></div>`;const names=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];q('summaryRows').innerHTML=months.map((m,i)=>`<div class="summaryRow"><span>${names[i]}</span><b>${fmt(m.n)}</b><b>${fmt(m.e)}</b><b>${fmt(m.h)}</b></div>`).join('');msg('summaryMsg','',true)}
async function loadCompany(){if(me.role!=='admin')return;const now=new Date(),pb=payrollBounds(now.getFullYear(),now.getMonth());q('companyPeriod').textContent=`${pad(pb.start.getDate())}/${pad(pb.start.getMonth()+1)}/${pb.start.getFullYear()} → ${pad(pb.end.getDate())}/${pad(pb.end.getMonth()+1)}/${pb.end.getFullYear()}`;const r=await api('admin/summary',{p_session_token:token,p_start_date:iso(new Date(now.getFullYear(),now.getMonth(),1)),p_end_date:iso(new Date(now.getFullYear(),now.getMonth()+1,0))});if(!r.ok){msg('companyMsg',r.error||'No se pudo cargar');return}q('companyList').innerHTML=(r.employees||[]).map(e=>`<div class="day"><div class="daytop"><span>${esc(e.full_name)}</span></div><div class="tags"><span class="tag">Normal ${fmt(e.normal)} h</span><span class="tag">Extra ${fmt(e.extra)} h</span><span class="tag fest">Fest. ${fmt(e.holiday)} h</span>${e.vacations?`<span class="tag vc">VC ${e.vacations} d</span>`:''}</div></div>`).join('');}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{if(b.classList.contains('hidden'))return;document.querySelectorAll('#nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');['Today','Month','Calendar','Summary','Profile','Company'].forEach(t=>q('tab'+t).classList.toggle('hidden',t!==b.dataset.tab));if(b.dataset.tab==='Today')loadToday();if(b.dataset.tab==='Month')loadMonth();if(b.dataset.tab==='Calendar')loadCalendar();if(b.dataset.tab==='Summary')loadSummary();if(b.dataset.tab==='Company')loadCompany()});
q('logoutBtn').onclick=async()=>{try{await api('logout',{p_session_token:token})}catch{}localStorage.removeItem('efs_token');location.reload()};
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
boot();
})();
</script>
</body></html>
