name: Temporary Wood Rift APK build
on:
  push:
    branches: [ woodrift-apk-build-20260902 ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply approved Wood Rift UI
        run: |
          python3 - <<'PY'
          import base64, re
          text=open('woodrift-v220-mockup-patch.tgz.b64','r',encoding='utf-8').read()
          text=''.join(re.findall(r'[A-Za-z0-9+/=]', text))
          open('/tmp/woodrift-v223.tgz','wb').write(base64.b64decode(text))
          PY
          tar -xzf /tmp/woodrift-v223.tgz
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Wood Rift
        run: cd woodrift-game && gradle assembleDebug
      - name: Verify APK and manifest
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose woodrift-game/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging woodrift-game/app/build/outputs/apk/debug/app-debug.apk | tee /tmp/badging.txt
          grep -q "package: name='com.woodrift.game'" /tmp/badging.txt
          grep -q "versionName='2.2.3'" /tmp/badging.txt
          grep -q "launchable-activity: name='com.woodrift.game.MainActivity'" /tmp/badging.txt
          cp woodrift-game/app/build/outputs/apk/debug/app-debug.apk WoodRift_v2_2_3_Themes.apk
      - uses: actions/upload-artifact@v4
        with:
          name: WoodRift_v2_2_3_Themes_APK
          path: WoodRift_v2_2_3_Themes.apk
