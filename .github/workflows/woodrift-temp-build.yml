name: Temporary Wood Rift APK build
on:
  push:
    branches: [ woodrift-apk-build-20260902 ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Wood Rift
        run: cd woodrift-game && gradle assembleDebug
      - name: Verify and name APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose woodrift-game/app/build/outputs/apk/debug/app-debug.apk
          cp woodrift-game/app/build/outputs/apk/debug/app-debug.apk WoodRift_v2_0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: WoodRift_v2_0_APK
          path: WoodRift_v2_0.apk
