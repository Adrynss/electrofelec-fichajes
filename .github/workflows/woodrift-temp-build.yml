name: Temporary Wood Rift APK build
on:
  push:
    branches: [ woodrift-apk-build-20260902 ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply Wood Rift v2.1.2 source
        run: |
          base64 -d woodrift-v21-patch.tgz.b64 > /tmp/wr212.tgz
          tar -xzf /tmp/wr212.tgz -C woodrift-game
      - name: Build Wood Rift
        run: cd woodrift-game && gradle assembleDebug
      - name: Verify APK and manifest
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose woodrift-game/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging woodrift-game/app/build/outputs/apk/debug/app-debug.apk | tee /tmp/badging.txt
          grep -q "package: name='com.woodrift.game'" /tmp/badging.txt
          grep -q "versionName='2.1.2'" /tmp/badging.txt
          grep -q "launchable-activity: name='com.woodrift.game.MainActivity'" /tmp/badging.txt
          cp woodrift-game/app/build/outputs/apk/debug/app-debug.apk WoodRift_v2_1_2.apk
      - uses: actions/upload-artifact@v4
        with:
          name: WoodRift_v2_1_2_APK
          path: WoodRift_v2_1_2.apk
