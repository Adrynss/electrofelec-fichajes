name: Build Electrofelec Fichajes APK

on:
  push:
    branches: [ worker-fichajes-module ]
    paths:
      - 'android-worker/**'
      - '.github/workflows/build-worker-apk.yml'
      - 'settings.gradle'
      - 'build.gradle'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Assemble worker source
        run: |
          mkdir -p android-worker/src/main/java/com/electrofelec/fichajes
          cat android-worker/srcparts/MainActivity.java.part* > android-worker/src/main/java/com/electrofelec/fichajes/MainActivity.java
          test -s android-worker/src/main/java/com/electrofelec/fichajes/MainActivity.java
          grep -q 'renderFichajes' android-worker/src/main/java/com/electrofelec/fichajes/MainActivity.java
          grep -q 'String\[\] tabs={"Hoy","Mes","Calendario","Fichajes","Resumen","Perfil"}' android-worker/src/main/java/com/electrofelec/fichajes/MainActivity.java
      - name: Build unsigned release APK
        run: gradle :android-worker:assembleRelease
      - name: Verify output
        run: |
          test -s android-worker/build/outputs/apk/release/android-worker-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android-worker/build/outputs/apk/release/android-worker-release-unsigned.apk | tee /tmp/badging.txt
          grep -q "package: name='com.electrofelec.fichajes'" /tmp/badging.txt
          grep -q "versionName='1.3-fichajes'" /tmp/badging.txt
      - name: Prepare artifact and signing tool
        run: |
          cp android-worker/build/outputs/apk/release/android-worker-release-unsigned.apk Electrofelec_Fichajes_v1_3_UNSIGNED.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" apksigner.jar
          test -s apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: Electrofelec_Fichajes_v1_3_BUILD
          path: |
            Electrofelec_Fichajes_v1_3_UNSIGNED.apk
            apksigner.jar
          if-no-files-found: error
      - name: Download JADX for original-source verification
        run: |
          curl -L --fail --retry 3 -o jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip
          test -s jadx.zip
      - uses: actions/upload-artifact@v4
        with:
          name: jadx-1.5.6
          path: jadx.zip
          if-no-files-found: error
