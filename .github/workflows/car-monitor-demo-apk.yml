name: Build Car Monitor Demo APK

on:
  push:
    branches: [car-monitor-demo-build]
    paths:
      - 'car-monitor-demo/**'
      - '.github/workflows/car-monitor-demo-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Apply v9 behavior patch
        working-directory: car-monitor-demo
        run: python3 v9_patch.py

      - name: Apply v10 reference UI patch
        working-directory: car-monitor-demo
        run: python3 v10_patch.py

      - name: Apply v11 16x9 reference UI patch
        working-directory: car-monitor-demo
        run: python3 v11_patch.py

      - name: Apply v12 chunky icon and bold number patch
        working-directory: car-monitor-demo
        run: python3 v12_patch.py

      - name: Apply v13 polished glow and shadow patch
        working-directory: car-monitor-demo
        run: python3 v13_patch.py

      - name: Build debug APK
        working-directory: car-monitor-demo
        run: gradle --no-daemon assembleDebug

      - name: Copy APK
        run: cp car-monitor-demo/app/build/outputs/apk/debug/app-debug.apk CarMonitor_v13_Polished.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarMonitor_v13_Polished
          path: CarMonitor_v13_Polished.apk
          if-no-files-found: error
