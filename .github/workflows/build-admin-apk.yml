name: Build Electrofelec Admin APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare Gestor completo mobile UI v2.12
        run: |
          mkdir -p android-admin/src/main/assets
          cat android-admin/ui/v13gz_*.part > /tmp/admin_v13.gz.b64
          base64 -d /tmp/admin_v13.gz.b64 | gzip -dc > android-admin/src/main/assets/index.html
          python android-admin/patch_v14.py
          python android-admin/patch_v20.py
          python android-admin/patch_v25_clean.py
          python android-admin/patch_v26.py
          python android-admin/patch_v27.py
          python android-admin/patch_v28.py
          python android-admin/patch_v29.py
          python android-admin/patch_v210.py
          python android-admin/patch_v210_fix.py
          python android-admin/patch_v211.py
          python android-admin/patch_v212.py
          test -s android-admin/src/main/assets/index.html
          python - <<'PY'
          from pathlib import Path
          h=Path('android-admin/src/main/assets/index.html').read_text(encoding='utf-8')
          required=[
            'Electrofelec Admin v2.12',
            'secPersonalZone',
            'MI JORNADA',
            'HISTÓRICO FICHAJES',
            'NÓMINAS',
            'function g212OpenPersonal',
            'function g212RenderHistory',
            'function g212OpenOfficialMonth',
            'function g212RenderPayroll',
            'function g212OpenSignature',
            'FIRMAR MES',
            'FIRMAR RECEPCIÓN',
            '/confirm',
            '/worker/sign'
          ]
          missing=[x for x in required if x not in h]
          if missing: raise SystemExit('Faltan marcadores v2.12: '+repr(missing))
          print('Smoke UI v2.12 OK')
          PY

      - name: Validate Admin JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('android-admin/src/main/assets/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S|re.I)
          if not scripts:
              raise SystemExit('No se encontró JavaScript inline')
          js='\n'.join(scripts)
          Path('/tmp/electrofelec_admin.js').write_text(js,encoding='utf-8')
          print('JS extraído:',len(js),'bytes')
          if js.count('showSection=function') != 1:
              raise SystemExit('Se detectaron wrappers encadenados de showSection')
          PY
          node --check /tmp/electrofelec_admin.js

      - name: Build debug APK
        run: gradle :android-admin:assembleDebug

      - name: Verify APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android-admin/build/outputs/apk/debug/android-admin-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android-admin/build/outputs/apk/debug/android-admin-debug.apk | tee /tmp/badging.txt
          grep -q "versionCode='18'" /tmp/badging.txt
          grep -q "versionName='2.12-admin'" /tmp/badging.txt

      - name: Prepare artifact
        run: |
          cp android-admin/build/outputs/apk/debug/android-admin-debug.apk Electrofelec_Admin_v2_12_MI_ZONA_3_BOTONES.apk
          test -s Electrofelec_Admin_v2_12_MI_ZONA_3_BOTONES.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Electrofelec_Admin_v2_12_MI_ZONA_3_BOTONES
          path: Electrofelec_Admin_v2_12_MI_ZONA_3_BOTONES.apk
          if-no-files-found: error
