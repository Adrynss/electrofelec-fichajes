name: Build Electrofelec Admin APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare Gestor completo mobile UI v2.5 clean
        run: |
          mkdir -p android-admin/src/main/assets
          cat android-admin/ui/v13gz_*.part > /tmp/admin_v13.gz.b64
          base64 -d /tmp/admin_v13.gz.b64 | gzip -dc > android-admin/src/main/assets/index.html
          python android-admin/patch_v14.py
          python android-admin/patch_v20.py
          python android-admin/patch_v25_clean.py
          test -s android-admin/src/main/assets/index.html
          grep -q "Electrofelec Admin v2.5" android-admin/src/main/assets/index.html
          grep -q "APP v2.5" android-admin/src/main/assets/index.html
          grep -q 'id="secMyPunch"' android-admin/src/main/assets/index.html
          grep -q 'Estado de fichajes de hoy' android-admin/src/main/assets/index.html
          grep -q 'trabajadores + Adrián + Ángel' android-admin/src/main/assets/index.html
          grep -q 'INICIAR JORNADA · 8 H' android-admin/src/main/assets/index.html
          grep -q 'function g25Period' android-admin/src/main/assets/index.html
          grep -q '/admin/time-range' android-admin/src/main/assets/index.html
          grep -q '/admin/start-admin-day' android-admin/src/main/assets/index.html
          grep -q '/admin/profiles' android-admin/src/main/assets/index.html
          grep -q 'electrofelec-gestor-sync' android-admin/src/main/assets/index.html
          ! grep -q 'Admin v2.1 · FIX trabajadores/horas' android-admin/src/main/assets/index.html
          ! grep -q 'Admin v2.2 · FIX definitivo' android-admin/src/main/assets/index.html
          ! grep -q 'Admin v2.3 · fichaje propio' android-admin/src/main/assets/index.html
          ! grep -q 'Admin v2.4 · estabilidad' android-admin/src/main/assets/index.html

      - name: Validate Admin JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('android-admin/src/main/assets/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S|re.I)
          if not scripts:
              raise SystemExit('No se encontró JavaScript inline')
          js='\n'.join(scripts)
          Path('/tmp/electrofelec_admin.js').write_text(js,encoding='utf-8')
          print('JS extraído:',len(js),'bytes')
          if js.count('showSection=function') != 1:
              raise SystemExit('Se detectaron wrappers encadenados de showSection')
          PY
          node --check /tmp/electrofelec_admin.js

      - name: Build debug APK
        run: gradle :android-admin:assembleDebug

      - name: Verify APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android-admin/build/outputs/apk/debug/android-admin-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android-admin/build/outputs/apk/debug/android-admin-debug.apk | tee /tmp/badging.txt
          grep -q "versionCode='11'" /tmp/badging.txt
          grep -q "versionName='2.5-admin'" /tmp/badging.txt

      - name: Prepare artifact
        run: |
          cp android-admin/build/outputs/apk/debug/android-admin-debug.apk Electrofelec_Admin_v2_5_GESTOR_COMPLETO.apk
          test -s Electrofelec_Admin_v2_5_GESTOR_COMPLETO.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Electrofelec_Admin_v2_5_GESTOR_COMPLETO
          path: Electrofelec_Admin_v2_5_GESTOR_COMPLETO.apk
          if-no-files-found: error
