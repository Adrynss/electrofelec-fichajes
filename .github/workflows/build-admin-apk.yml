name: Build Electrofelec Admin APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare Gestor mobile UI
        run: |
          mkdir -p android-admin/src/main/assets
          cat android-admin/ui/v13gz_*.part > /tmp/admin_v13.gz.b64
          base64 -d /tmp/admin_v13.gz.b64 | gzip -dc > android-admin/src/main/assets/index.html
          test -s android-admin/src/main/assets/index.html
          grep -q "Electrofelec Admin v1.3" android-admin/src/main/assets/index.html
          grep -q "Trabajadores activos" android-admin/src/main/assets/index.html
          grep -q 'data-mobile-tab="Workers"' android-admin/src/main/assets/index.html
          grep -q 'circle cx="256"' android-admin/src/main/assets/index.html
          grep -q "Nóminas del mes" android-admin/src/main/assets/index.html
          grep -q "Obra debajo de las horas" android-admin/src/main/assets/index.html

      - name: Build debug APK
        run: gradle :android-admin:assembleDebug

      - name: Verify APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android-admin/build/outputs/apk/debug/android-admin-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android-admin/build/outputs/apk/debug/android-admin-debug.apk | head -5

      - name: Prepare artifact
        run: |
          cp android-admin/build/outputs/apk/debug/android-admin-debug.apk Electrofelec_Admin_v1_3_GESTOR_MOVIL.apk
          test -s Electrofelec_Admin_v1_3_GESTOR_MOVIL.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Electrofelec_Admin_v1_3_GESTOR_MOVIL
          path: Electrofelec_Admin_v1_3_GESTOR_MOVIL.apk
          if-no-files-found: error
