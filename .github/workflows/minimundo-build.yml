name: Build MiniMundo APK

on:
  push:
    branches:
      - minimundo-apk-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses >/dev/null
      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: minimundo-app
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: minimundo-debug-apk
          path: minimundo-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Prepare local Android build kit
        run: |
          mkdir -p android-kit/platform android-kit/build-tools
          cp "$ANDROID_HOME/platforms/android-35/android.jar" android-kit/platform/
          cp -a "$ANDROID_HOME/build-tools/35.0.0/." android-kit/build-tools/
      - name: Upload Android build kit
        uses: actions/upload-artifact@v4
        with:
          name: android-build-kit-35
          path: android-kit
          if-no-files-found: error
      - name: Download CC0 kids music
        run: |
          curl -L --fail --retry 3 -o children_soundtrack_1.wav "https://opengameart.org/sites/default/files/children_soundtrack_1.wav"
          ffmpeg -y -loglevel error -i children_soundtrack_1.wav -c:a libvorbis -q:a 4 minimundo_cc0.ogg
          printf 'Children\x27s Game Music 1 - Picnic\nAuthor: heartade\nLicense: CC0\nSource: https://opengameart.org/content/childrens-game-music-1-picnic\n' > MUSIC-LICENSE.txt
      - name: Upload CC0 music
        uses: actions/upload-artifact@v4
        with:
          name: minimundo-music-cc0
          path: |
            minimundo_cc0.ogg
            MUSIC-LICENSE.txt
          if-no-files-found: error
