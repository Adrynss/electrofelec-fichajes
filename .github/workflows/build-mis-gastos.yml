name: Build Mis Gastos APK
on:
  push:
    branches: [ "chatgpt-mis-gastos" ]
    paths:
      - 'mis-gastos-app/**'
      - '.github/workflows/build-mis-gastos.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mis-gastos-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Copy APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MisGastos-v1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MisGastos-v1.0-apk
          path: mis-gastos-app/MisGastos-v1.0.apk
