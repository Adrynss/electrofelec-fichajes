<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071009">
<title>Electrofelec Admin Web v3</title>
<link rel="stylesheet" href="./style.css?v=3">
</head>
<body>
<div id="login" class="login">
  <div class="loginCard">
    <div class="brandLogin"><div class="bolt">⚡</div><div><b>Electrofelec Admin</b><small>Web de prueba · v3</small></div></div>
    <div class="field"><label>USUARIO</label><input id="username" autocomplete="username" autocapitalize="none"></div>
    <div class="field"><label>PIN</label><input id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password"></div>
    <button id="loginBtn" class="btn primary full">ENTRAR</button>
    <div id="loginMsg" class="msg"></div>
  </div>
</div>
<div id="shell" class="app hidden">
  <aside id="sidebar" class="sidebar">
    <div class="sideBrand"><b>⚡ Electrofelec</b><small>ADMIN WEB</small></div>
    <nav class="nav">
      <button data-page="dashboard" class="active">⌂ <span>Inicio</span></button>
      <button data-page="mine" class="personalNav">● <span>Mi zona</span></button>
      <div class="navTitle">Personal</div>
      <button data-page="workers">👷 <span>Trabajadores</span></button>
      <button data-page="punches">✓ <span>Fichajes empresa</span></button>
      <button data-page="hours">◷ <span>Registro de horas</span></button>
      <button data-page="payroll">€ <span>Nóminas empresa</span></button>
      <div class="navTitle">Documentación</div>
      <button data-page="cae">📁 <span>CAE / PRL</span></button>
      <button data-page="company">🏢 <span>Empresa</span></button>
      <div class="navTitle">Gestión</div>
      <button data-page="accounting">▤ <span>Contabilidad</span></button>
      <button data-page="rates">€/h <span>Precio hora obra</span></button>
    </nav>
    <div class="sideFoot"><div id="sideWho">Administrador</div><button id="logout" class="btn" style="margin-top:9px">Cerrar sesión</button></div>
  </aside>
  <div id="shade" class="shade"></div>
  <main class="main">
    <header class="top"><div class="topLeft"><button id="hamb" class="btn hamb">☰</button><div><b id="topTitle">Inicio</b><small id="topSub">Electrofelec System</small></div></div><span class="pill">● ONLINE</span></header>
    <section id="content" class="content"></section>
  </main>
</div>
<div id="sigOverlay" class="overlay hidden">
 <div class="sigBox">
  <h2 id="sigTitle">Firma</h2><div id="sigSub" class="muted"></div>
  <div class="canvasWrap"><canvas id="sigCanvas"></canvas></div>
  <div id="sigMsg" class="sigMsg">Firma dentro del recuadro con el dedo.</div>
  <div class="sigActions"><button id="sigClear" class="btn">Borrar</button><button id="sigCancel" class="btn">Cancelar</button><button id="sigSave" class="btn primary">Firmar</button></div>
 </div>
</div>
<script src="./app.js?v=3"></script>
</body>
</html>
