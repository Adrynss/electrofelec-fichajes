x;color:#6f8575;font-size:10px;font-weight:900;letter-spacing:.8px;padding:0 10px;text-transform:uppercase}.nav button{display:flex;gap:11px;align-items:center;width:100%;text-align:left;border:1px solid transparent;background:transparent;color:#b7c8ba;border-radius:11px;padding:11px 12px}.nav button:hover{background:#0d1b12;border-color:#1f3526}.nav button.active{background:linear-gradient(90deg,#18311e,#0e1d13);border-color:#2c5836;color:#fff;box-shadow:inset 4px 0 var(--green)}.ico{width:20px;text-align:center}.sideFoot{margin-top:auto;border-top:1px solid #18271d;padding:14px 9px 0;color:var(--muted);font-size:11px}.main{min-width:0}.topbar{height:72px;position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 22px;background:#071009e8;backdrop-filter:blur(12px);border-bottom:1px solid #1c2b21}.topTitle b{display:block;font-size:17px}.topTitle small{color:var(--muted)}.hamb{display:none}.content{padding:22px;max-width:1500px;margin:0 auto}.hero{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px}.hero h1{margin:0;font-size:26px}.hero p{margin:6px 0 0;color:var(--muted)}.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid #31563a;background:#0d1b11;color:#a9e6b2;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{background:linear-gradient(180deg,#0d1b12,#09130d);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}.kpi span{display:block;color:var(--muted);font-size:10px;font-weight:900;text-transform:uppercase}.kpi b{display:block;font-size:28px;margin-top:7px}.menuGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}.menuCard{min-height:122px;text-align:left;display:flex;flex-direction:column;justify-content:space-between}.menuCard .mi{font-size:24px}.menuCard b{font-size:15px}.menuCard small{color:var(--muted);line-height:1.35}.sectionHead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:5px 0 13px}.sectionHead h2{margin:0;font-size:18px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.list{display:grid;gap:8px}.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid #223328;background:#09140d;border-radius:12px;padding:12px}.row b{display:block}.row small{color:var(--muted)}.state{border-radius:999px;padding:6px 9px;font-size:10px;font-weight:900;white-space:nowrap}.ok{background:#143b20;color:#8df0a2}.warn{background:#443812;color:#f6d874}.bad{background:#4a171c;color:#ff9da5}.info{background:#123640;color:#9ce8f5}.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.filters button.active{background:#18582a;border-color:#338a49}.docGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.docCard{display:grid;gap:9px}.docTop{display:flex;justify-content:space-between;gap:10px}.docName{font-weight:900;overflow-wrap:anywhere}.docMeta{font-size:11px;color:var(--muted);display:grid;gap:2px}.docActions{display:flex;gap:7px;flex-wrap:wrap}.empty{color:var(--muted);padding:24px;text-align:center}.notice{border:1px solid #4c4b24;background:#211f0f;color:#e9db8d;border-radius:12px;padding:12px}.mobileShade{display:none}.readonly{color:#b9d7bf;font-size:11px}.search{width:min(360px,100%);background:#08110b;color:var(--text);border:1px solid #314737;border-radius:11px;padding:10px 12px}
@media(max-width:1100px){.app{grid-template-columns:220px minmax(0,1fr)}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.menuGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.docGrid{grid-template-columns:1fr}}

<script>
const API='https://kbdmraxjfgtttopsyfuy.supabase.co/functions/v1/electrofelec-fichajes/api/';
const V3='https://kbdmraxjfgtttopsyfuy.supabase.co/functions/v1/electrofelec-admin-v3';
const GS='https://kbdmraxjfgtttopsyfuy.supabase.co/functions/v1/electrofelec-gestor-sync';
let token=localStorage.getItem('efs_admin_web_token')||'',me=null,employees=[],caeData=null,currentPage='dashboard',caeFilter='all',caeScope='employee';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0'); const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
async function post(base,path,body={}){try{const r=await fetch(base+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),cache:'no-store'});const j=await r.json().catch(()=>({ok:false,error:'Respuesta no válida'}));if(!r.ok&&j.ok!==false)j.ok=false;return j}catch(e){return{ok:false,error:'Sin conexión'}}}
async function api(path,b={}){return post(API,path,b)} async function v3(path,b={}){return post(V3,path,{p_session_token:token,...b})} async function gs(path,b={}){return post(GS,path,{p_session_token:token,...b})}
function setLoginMsg(t){$('#loginMsg').textContent=t||''}
async function login(){const u=$('#username').value.trim(),p=$('#pin').value.trim();if(!u||p.length!==6)return setLoginMsg('Introduce usuario y PIN de 6 cifras');setLoginMsg('Entrando…');const r=await api('login',{p_username:u,p_pin:p});if(!r.ok)return setLoginMsg(r.error||'No se pudo iniciar sesión');token=r.session_token;localStorage.setItem('efs_admin_web_token',token);const m=await api('me',{p_session_token:token});if(!m.ok||m.role!=='admin'){localStorage.removeItem('efs_admin_web_token');token='';return setLoginMsg('Esta web es solo para administradores')}me=m;openApp()}
async function boot(){if(!token)return;const m=await api('me',{p_session_token:token});if(!m.ok||m.role!=='admin'){localStorage.removeItem('efs_admin_web_token');token='';return}me=m;openApp()}
function openApp(){$('#login').classList.add('hidden');$('#shell').classList.remove('hidden');$('#sideWho').textContent=(me.full_name||'Administrador')+' · Admin';render('dashboard')}
function logout(){localStorage.removeItem('efs_admin_web_token');location.reload()}
function closeMenu(){$('#sidebar').classList.remove('open');$('#shade').classList.remove('open')}
function navActive(p){$$('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p))}
const titles={dashboard:['Inicio','Resumen general'],workers:['Trabajadores','Plantilla activa'],punches:['Fichajes','Quién ha fichado hoy'],hours:['Registro de horas','Horas, incidencias y revisión'],payroll:['Nóminas','Nóminas y firmas'],cae:['CAE / PRL','Solo lectura en la web'],company:['Empresa','Documentación y datos de empresa'],accounting:['Contabilidad','Facturas, pedidos y banco'],rates:['Precio hora obra','Cálculo de costes']};
async function render(p){currentPage=p;navActive(p);closeMenu();$('#topTitle').textContent=titles[p]?.[0]||p;$('#topSub').textContent=titles[p]?.[1]||'';$('#content').innerHTML='<div class="card">Cargando…</div>';try{if(p==='dashboard')return renderDashboard();if(p==='workers')return renderWorkers();if(p==='punches')return renderPunches();if(p==='cae')return renderCAE();return renderStub(p)}catch(e){$('#content').innerHTML='<div class="card"><b>No se pudo cargar</b><div style="color:var(--muted);margin-top:8px">'+esc(e.message||e)+'</div></div>'}}
async function loadEmployees(){if(employees.length)return employees;const r=await api('admin/employees',{p_session_token:token});if(r.ok)employees=r.employees||r.items||[];if(!employees.length){const d=new Date(),a=new Date(d.getFullYear(),d.getMonth(),1),b=new Date(d.getFullYear(),d.getMonth()+1,0),s=await api('admin/summary',{p_session_token:token,p_start_date:iso(a),p_end_date:iso(b)});if(s.ok)employees=s.employees||[]}return employees}
async function renderDashboard(){const list=await loadEmployees();let punch={};try{const z=await gs('/admin/today');if(z.ok){const by=new Map((z.entries||[]).map(e=>[e.employee_id,e]));const active=(z.profiles||[]).filter(x=>x.active!==false);punch={total:active.length,clocked:active.filter(x=>by.get(x.id)?.started_at).length,missing:active.filter(x=>!by.get(x.id)?.started_at&&!by.get(x.id)?.incident).length,inc:active.filter(x=>!!by.get(x.id)?.incident).length}}catch{}$('#content').innerHTML=`<div class="hero"><div><h1>Panel de administración</h1><p>Misma línea visual que el gestor de Windows, repartida en más menús para móvil.</p></div><span class="pill">WEB · PRUEBA</span></div><div class="grid"><div class="card kpi"><span>Trabajadores</span><b>${list.filter(x=>x.active!==false).length||'—'}</b></div><div class="card kpi"><span>Fichados hoy</span><b style="color:var(--green)">${punch.clocked??'—'}</b></div><div class="card kpi"><span>Sin fichar</span><b style="color:var(--warn)">${punch.missing??'—'}</b></div><div class="card kpi"><span>Incidencias</span><b style="color:var(--blue)">${punch.inc??'—'}</b></div></div><div class="menuGrid">${[['workers','👷','Trabajadores','Plantilla y ficha de cada trabajador'],['punches','✓','Fichajes','Jornada de hoy y regularizaciones'],['hours','◷','Registro de horas','Horas e incidencias sin tablas gigantes'],['payroll','€','Nóminas','Documentos, firmas y certificados'],['cae','📁','CAE / PRL','Consulta documental en solo lectura'],['accounting','▤','Contabilidad','Facturas, pedidos y banco'],['rates','€/h','Precio hora obra','Costes y precio recomendado'],['company','🏢','Empresa','Documentación y carpetas de empresa']].map(x=>`<button class="card menuCard" data-go="${x[0]}"><span class="mi">${x[1]}</span><div><b>${x[2]}</b><small>${x[3]}</small></div></button>`).join('')}</div>`;$$('[data-go]').forEach(b=>b.onclick=()=>render(b.dataset.go))}
async function renderWorkers(){const list=(await loadEmployees()).filter(x=>x.active!==false);$('#content').innerHTML=`<div class="sectionHead"><div><h2>Trabajadores</h2><div class="readonly">Vista compacta: cada trabajador abre su propia ficha en lugar de mostrarlo todo a la vez.</div></div><input id="workerSearch" class="search" placeholder="Buscar trabajador…"></div><div id="workerList" class="list"></div>`;const draw=()=>{const q=$('#workerSearch').value.trim().toLowerCase(),a=list.filter(x=>String(x.full_name||x.name||'').toLowerCase().includes(q));$('#workerList').innerHTML=a.map(x=>`<div class="row"><div><b>${esc(x.full_name||x.name||'Trabajador')}</b><small>${esc(x.dni_nie||x.dni||'')} ${x.username?' · '+esc(x.username):''}</small></div><button class="btn" onclick="alert('En la siguiente pasada conectaremos aquí la ficha completa del gestor Windows sin meter toda la información en una sola pantalla.')">Abrir ficha</button></div>`).join('')||'<div class="empty">Sin resultados</div>'};$('#workerSearch').oninput=draw;draw()}
async function renderPunches(){const z=await gs('/admin/today');if(!z.ok)throw Error(z.error||'No se pudieron cargar los fichajes');const by=new Map((z.entries||[]).map(e=>[e.employee_id,e]));const people=(z.profiles||[]).filter(x=>x.active!==false).map(p=>({p,e:by.get(p.id)})).sort((a,b)=>String(a.p.full_name).localeCompare(String(b.p.full_name),'es'));$('#content').innerHTML=`<div class="sectionHead"><div><h2>Fichajes de hoy</h2><div class="readonly">Una fila por persona; sin tabla horizontal.</div></div><button id="refreshPunch" class="btn">Actualizar</button></div><div class="list">${people.map(({p,e})=>{let cls='warn',txt='Sin fichar',detail='';if(e?.started_at){cls='ok';txt='Fichado';detail=new Intl.DateTimeFormat('es-ES',{timeZone:'Europe/Madrid',hour:'2-digit',minute:'2-digit'}).format(new Date(e.started_at))}else if(e?.incident){cls='info';txt='Incidencia';detail=e.incident}return`<div class="row"><div><b>${esc(p.full_name)}</b><small>${p.role==='admin'?'Administrador':'Trabajador'}${detail?' · '+esc(detail):''}</small></div><span class="state ${cls}">${txt}</span></div>`}).join('')}</div>`;$('#refreshPunch').onclick=()=>renderPunches()}
function docState(x){const s=String(x.status||'');if(s==='expired')return['bad','Caducado'];if(s==='upcoming')return['warn','Próximo'];if(s==='pending')return['warn','Pendiente'];if(s==='not_required')return['info','No requerido'];return['ok','Vigente']}
async function renderCAE(){if(!caeData){const z=await v3('/docs/list');if(!z.ok)throw Error(z.error||'No se pudo cargar CAE');caeData=z}drawCAE()}
function drawCAE(){const all=(caeData.items||[]).filter(x=>String(x.document_code||'').startsWith('sys_')===false),scoped=all.filter(x=>x.scope===caeScope),f=scoped.filter(x=>caeFilter==='all'||x.status===caeFilter);const c=caeData.counts||{};$('#content').innerHTML=`<div class="hero"><div><h1>CAE / PRL</h1><p>Consulta documental. En esta web queda bloqueada cualquier edición.</p></div><span class="pill">🔒 SOLO LECTURA</span></div><div class="notice">Aquí no se puede añadir, sustituir, editar, borrar ni marcar documentos. Es deliberado para que la gestión CAE siga haciéndose desde Windows.</div><div class="sectionHead" style="margin-top:14px"><div class="toolbar"><button class="btn ${caeScope==='employee'?'primary':''}" data-scope="employee">Empleados</button><button class="btn ${caeScope==='company'?'primary':''}" data-scope="company">Empresa</button></div><button id="caeRefresh" class="btn">Actualizar</button></div><div class="filters"><button class="btn ${caeFilter==='all'?'active':''}" data-filter="all">Todos</button><button class="btn ${caeFilter==='pending'?'active':''}" data-filter="pending">Pendientes ${c.pending??''}</button><button class="btn ${caeFilter==='expired'?'active':''}" data-filter="expired">Caducados ${c.expired??''}</button><button class="btn ${caeFilter==='upcoming'?'active':''}" data-filter="upcoming">Próximos ${c.upcoming??''}</button></div><div class="docGrid">${f.map(x=>{const [cl,st]=docState(x);return`<div class="card docCard"><div class="docTop"><div><div class="docName">${esc(x.document_name||x.type_name||x.original_name||'Documento')}</div><div class="docMeta"><span>${esc(x.owner_name||'')}</span><span>${esc(x.category||'')}</span><span>${x.expiry_date?'Caduca: '+esc(String(x.expiry_date).slice(0,10)):'Sin caducidad indicada'}</span></div></div><span class="state ${cl}">${st}</span></div><div class="docActions">${x.file_id?`<button class="btn" data-open="${x.file_id}">Abrir</button><button class="btn" data-down="${x.file_id}">Descarga
