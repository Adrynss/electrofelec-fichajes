<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071009">
<title>Electrofelec Admin Web</title>
<style>
:root{--bg:#071009;--panel:#0d1b12;--panel2:#09130d;--line:#24352a;--text:#eef7ef;--muted:#91a496;--green:#63e63f;--warn:#f0c85c;--bad:#ff7179;--blue:#73c7f4}*{box-sizing:border-box}html,body{margin:0;max-width:100%;overflow-x:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input{font:inherit}.hidden{display:none!important}.login{min-height:100dvh;display:grid;place-items:center;padding:18px}.loginCard{width:min(430px,100%);background:linear-gradient(180deg,#0f2115,#09130d);border:1px solid #2b4131;border-radius:20px;padding:24px}.brandLogin{display:flex;gap:13px;align-items:center;margin-bottom:20px}.bolt{font-size:38px;color:var(--green)}.brandLogin b{font-size:21px}.brandLogin small{display:block;color:var(--muted);margin-top:3px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:11px;font-weight:800;color:var(--muted)}.field input{width:100%;border:1px solid #314737;border-radius:12px;background:#08110b;color:var(--text);padding:14px}.btn{border:1px solid #31543a;border-radius:11px;background:#112219;color:#eaf8ed;padding:10px 13px;font-weight:800;cursor:pointer}.btn.primary{background:linear-gradient(180deg,#3ecf43,#219c33);color:#041006;border-color:#67ef6a}.btn.full{width:100%;padding:14px}.msg{min-height:20px;margin-top:10px;color:var(--bad);font-size:13px}.app{min-height:100dvh;display:grid;grid-template-columns:250px minmax(0,1fr)}.sidebar{height:100dvh;position:sticky;top:0;background:#061008;border-right:1px solid #1d2c22;padding:16px 12px;display:flex;flex-direction:column}.sideBrand{padding:6px 9px 18px}.sideBrand b{font-size:18px}.sideBrand small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.nav{display:grid;gap:5px;overflow:auto}.navTitle{padding:10px 9px 3px;color:#6f8575;font-size:9px;font-weight:900;letter-spacing:.8px;text-transform:uppercase}.nav button{width:100%;display:flex;align-items:center;gap:10px;text-align:left;border:1px solid transparent;border-radius:10px;background:transparent;color:#b8c9bb;padding:10px 11px}.nav button.active{background:linear-gradient(90deg,#18311e,#0e1d13);border-color:#2c5836;color:#fff;box-shadow:inset 4px 0 var(--green)}.sideFoot{margin-top:auto;border-top:1px solid #18271d;padding:12px 8px 0;color:var(--muted);font-size:11px}.main{min-width:0}.top{height:64px;position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#071009ee;border-bottom:1px solid #1c2b21}.top b{display:block}.top small{color:var(--muted)}.hamb{display:none}.content{padding:16px;max-width:1400px;margin:0 auto}.hero{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}.hero h1{font-size:24px;margin:0}.hero p{margin:5px 0 0;color:var(--muted)}.pill{display:inline-flex;border:1px solid #31563a;background:#0d1b11;color:#a9e6b2;border-radius:999px;padding:7px 10px;font-size:10px;font-weight:900}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.card{min-width:0;background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:14px;padding:14px}.kpi span{display:block;font-size:9px;font-weight:900;color:var(--muted);text-transform:uppercase}.kpi b{display:block;font-size:26px;margin-top:5px}.menuGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}.menuCard{min-height:100px;text-align:left;display:flex;flex-direction:column;justify-content:space-between}.menuCard strong{display:block}.menuCard small{display:block;color:var(--muted);margin-top:4px}.sectionHead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}.sectionHead h2{margin:0}.search{width:min(340px,100%);background:#08110b;color:var(--text);border:1px solid #314737;border-radius:10px;padding:10px}.list{display:grid;gap:8px}.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid #223328;background:#09140d;border-radius:11px;padding:11px}.row small{display:block;color:var(--muted);margin-top:3px}.state{border-radius:999px;padding:6px 9px;font-size:10px;font-weight:900;white-space:nowrap}.ok{background:#143b20;color:#8df0a2}.warn{background:#443812;color:#f6d874}.info{background:#123640;color:#9ce8f5}.bad{background:#4a171c;color:#ff9da5}.notice{border:1px solid #4c4b24;background:#211f0f;color:#e9db8d;border-radius:11px;padding:11px;margin-bottom:12px}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:11px}.docGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.docName{font-weight:900;overflow-wrap:anywhere}.docMeta{display:grid;gap:2px;color:var(--muted);font-size:11px;margin-top:6px}.docActions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.empty{color:var(--muted);text-align:center;padding:22px}.shade{display:none}
@media(max-width:1050px){.app{grid-template-columns:205px minmax(0,1fr)}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.menuGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.docGrid{grid-template-columns:1fr}}
@media(max-width:760px){.app{display:block}.sidebar{position:fixed;z-index:30;left:0;top:0;width:min(84vw,300px);transform:translateX(-105%);transition:.2s}.sidebar.open{transform:none}.shade{display:none;position:fixed;z-index:20;inset:0;background:#0009}.shade.open{display:block}.hamb{display:inline-block}.content{padding:12px}.top{padding:0 10px}.grid,.menuGrid{grid-template-columns:1fr 1fr}.hero h1{font-size:21px}.hero .pill{display:none}.row{grid-template-columns:1fr}.sectionHead{flex-direction:column}.search{width:100%}}
@media(max-width:430px){.grid,.menuGrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="login" class="login">
  <div class="loginCard">
    <div class="brandLogin"><div class="bolt">⚡</div><div><b>Electrofelec Admin</b><small>Web de prueba</small></div></div>
    <div class="field"><label>USUARIO</label><input id="username" autocomplete="username" autocapitalize="none"></div>
    <div class="field"><label>PIN</label><input id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password"></div>
    <button id="loginBtn" class="btn primary full">ENTRAR</button>
    <div id="loginMsg" class="msg"></div>
  </div>
</div>
<div id="shell" class="app hidden">
  <aside id="sidebar" class="sidebar">
    <div class="sideBrand"><b>⚡ Electrofelec</b><small>ADMIN WEB</small></div>
    <nav class="nav">
      <button data-page="dashboard" class="active">⌂ <span>Inicio</span></button>
      <div class="navTitle">Personal</div>
      <button data-page="workers">👷 <span>Trabajadores</span></button>
      <button data-page="punches">✓ <span>Fichajes</span></button>
      <button data-page="hours">◷ <span>Registro de horas</span></button>
      <button data-page="payroll">€ <span>Nóminas</span></button>
      <div class="navTitle">Documentación</div>
      <button data-page="cae">📁 <span>CAE / PRL</span></button>
      <button data-page="company">🏢 <span>Empresa</span></button>
      <div class="navTitle">Gestión</div>
      <button data-page="accounting">▤ <span>Contabilidad</span></button>
      <button data-page="rates">€/h <span>Precio hora obra</span></button>
    </nav>
    <div class="sideFoot"><div id="sideWho">Administrador</div><button id="logout" class="btn" style="margin-top:9px">Cerrar sesión</button></div>
  </aside>
  <div id="shade" class="shade"></div>
  <main class="main">
    <header class="top"><div style="display:flex;gap:9px;align-items:center"><button id="hamb" class="btn hamb">☰</button><div><b id="topTitle">Inicio</b><small id="topSub">Electrofelec System</small></div></div><span class="pill">● ONLINE</span></header>
    <section id="content" class="content"></section>
  </main>
</div>
<script>
(function(){
'use strict';
const API='https://kbdmraxjfgtttopsyfuy.supabase.co/functions/v1/electrofelec-fichajes/api/';
const V3='https://kbdmraxjfgtttopsyfuy.supabase.co/functions/v1/electrofelec-admin-v3';
const GS='https://kbdmraxjfgtttopsyfuy.supabase.co/functions/v1/electrofelec-gestor-sync';
let token=localStorage.getItem('efs_admin_web_token_v2')||'';
let me=null,employees=[],caeData=null,caeScope='employee',caeFilter='all';
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
async function post(base,path,body){try{const r=await fetch(base+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{}),cache:'no-store'});const text=await r.text();let j;try{j=JSON.parse(text)}catch(e){j={ok:false,error:text||'Respuesta no válida'}}if(!r.ok&&j.ok!==false)j.ok=false;return j}catch(e){return{ok:false,error:'Sin conexión: '+(e&&e.message?e.message:'error')}}}
const api=(path,b)=>post(API,path,b);
const v3=(path,b)=>post(V3,path,Object.assign({p_session_token:token},b||{}));
const gs=(path,b)=>post(GS,path,Object.assign({p_session_token:token},b||{}));
function msg(t){$('#loginMsg').textContent=t||''}
function closeMenu(){$('#sidebar').classList.remove('open');$('#shade').classList.remove('open')}
function openApp(){$('#login').classList.add('hidden');$('#shell').classList.remove('hidden');$('#sideWho').textContent=(me&&me.full_name?me.full_name:'Administrador')+' · Admin';render('dashboard')}
async function login(){const u=$('#username').value.trim(),p=$('#pin').value.trim();if(!u||p.length!==6){msg('Introduce usuario y PIN de 6 cifras');return}const btn=$('#loginBtn');btn.disabled=true;btn.textContent='ENTRANDO…';msg('');const r=await api('login',{p_username:u,p_pin:p});if(!r.ok){btn.disabled=false;btn.textContent='ENTRAR';msg(r.error||'No se pudo iniciar sesión');return}token=r.session_token||'';if(!token){btn.disabled=false;btn.textContent='ENTRAR';msg('El servidor no devolvió una sesión válida');return}const m=await api('me',{p_session_token:token});if(!m.ok){btn.disabled=false;btn.textContent='ENTRAR';msg(m.error||'No se pudo cargar el perfil');return}if(m.role!=='admin'){btn.disabled=false;btn.textContent='ENTRAR';msg('Esta web es solo para administradores');return}me=m;localStorage.setItem('efs_admin_web_token_v2',token);openApp()}
async function boot(){if(!token)return;const m=await api('me',{p_session_token:token});if(m.ok&&m.role==='admin'){me=m;openApp()}else{localStorage.removeItem('efs_admin_web_token_v2');token=''}}
function logout(){localStorage.removeItem('efs_admin_web_token_v2');location.reload()}
const titles={dashboard:['Inicio','Resumen general'],workers:['Trabajadores','Plantilla activa'],punches:['Fichajes','Quién ha fichado hoy'],hours:['Registro de horas','Horas e incidencias'],payroll:['Nóminas','Nóminas y firmas'],cae:['CAE / PRL','Solo lectura'],company:['Empresa','Documentación de empresa'],accounting:['Contabilidad','Facturas, pedidos y banco'],rates:['Precio hora obra','Cálculo de costes']};
function setNav(p){$$('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#topTitle').textContent=titles[p]?titles[p][0]:p;$('#topSub').textContent=titles[p]?titles[p][1]:'';closeMenu()}
async function render(p){setNav(p);$('#content').innerHTML='<div class="card">Cargando…</div>';try{if(p==='dashboard')await renderDashboard();else if(p==='workers')await renderWorkers();else if(p==='punches')await renderPunches();else if(p==='cae')await renderCAE();else renderStub(p)}catch(e){$('#content').innerHTML='<div class="card"><b>No se pudo cargar</b><div style="color:var(--muted);margin-top:7px">'+esc(e&&e.message?e.message:e)+'</div></div>'}}
async function loadEmployees(){if(employees.length)return employees;let r=await api('admin/employees',{p_session_token:token});if(r.ok)employees=r.employees||r.items||[];if(!employees.length){const d=new Date(),a=new Date(d.getFullYear(),d.getMonth(),1),b=new Date(d.getFullYear(),d.getMonth()+1,0);r=await api('admin/summary',{p_session_token:token,p_start_date:iso(a),p_end_date:iso(b)});if(r.ok)employees=r.employees||[]}return employees}
async function renderDashboard(){const list=await loadEmployees();let punch={};const z=await gs('/admin/today');if(z.ok){const by=new Map((z.entries||[]).map(e=>[e.employee_id,e]));const active=(z.profiles||[]).filter(x=>x.active!==false);punch={clocked:active.filter(x=>by.get(x.id)&&by.get(x.id).started_at).length,missing:active.filter(x=>!(by.get(x.id)&&by.get(x.id).started_at)&&!(by.get(x.id)&&by.get(x.id).incident)).length,inc:active.filter(x=>!!(by.get(x.id)&&by.get(x.id).incident)).length}}$('#content').innerHTML='<div class="hero"><div><h1>Panel de administración</h1><p>La misma información del gestor, repartida en pantallas más limpias.</p></div><span class="pill">WEB · PRUEBA</span></div><div class="grid"><div class="card kpi"><span>Trabajadores</span><b>'+list.filter(x=>x.active!==false).length+'</b></div><div class="card kpi"><span>Fichados hoy</span><b style="color:var(--green)">'+(punch.clocked==null?'—':punch.clocked)+'</b></div><div class="card kpi"><span>Sin fichar</span><b style="color:var(--warn)">'+(punch.missing==null?'—':punch.missing)+'</b></div><div class="card kpi"><span>Incidencias</span><b style="color:var(--blue)">'+(punch.inc==null?'—':punch.inc)+'</b></div></div><div class="menuGrid">'+[['workers','👷','Trabajadores','Plantilla y ficha individual'],['punches','✓','Fichajes','Jornada de hoy'],['hours','◷','Registro de horas','Horas e incidencias'],['payroll','€','Nóminas','Firmas y certificados'],['cae','📁','CAE / PRL','Consulta solo lectura'],['company','🏢','Empresa','Documentación de empresa'],['accounting','▤','Contabilidad','Facturas, pedidos y banco'],['rates','€/h','Precio hora obra','Costes y precio recomendado']].map(x=>'<button class="card menuCard" data-go="'+x[0]+'"><span style="font-size:22px">'+x[1]+'</span><div><strong>'+x[2]+'</strong><small>'+x[3]+'</small></div></button>').join('')+'</div>';$$('[data-go]').forEach(b=>b.onclick=()=>render(b.dataset.go))}
async function renderWorkers(){const list=(await loadEmployees()).filter(x=>x.active!==false);$('#content').innerHTML='<div class="sectionHead"><div><h2>Trabajadores</h2><small style="color:var(--muted)">Lista compacta, sin tabla horizontal.</small></div><input id="workerSearch" class="search" placeholder="Buscar trabajador…"></div><div id="workerList" class="list"></div>';const draw=()=>{const q=$('#workerSearch').value.trim().toLowerCase(),a=list.filter(x=>String(x.full_name||x.name||'').toLowerCase().includes(q));$('#workerList').innerHTML=a.map(x=>'<div class="row"><div><b>'+esc(x.full_name||x.name||'Trabajador')+'</b><small>'+esc(x.dni_nie||x.dni||'')+(x.username?' · '+esc(x.username):'')+'</small></div><button class="btn" disabled>Ficha completa · siguiente paso</button></div>').join('')||'<div class="card empty">Sin resultados</div>'};$('#workerSearch').oninput=draw;draw()}
async function renderPunches(){const z=await gs('/admin/today');if(!z.ok)throw new Error(z.error||'No se pudieron cargar los fichajes');const by=new Map((z.entries||[]).map(e=>[e.employee_id,e]));const people=(z.profiles||[]).filter(x=>x.active!==false).map(p=>({p:p,e:by.get(p.id)})).sort((a,b)=>String(a.p.full_name).localeCompare(String(b.p.full_name),'es'));$('#content').innerHTML='<div class="sectionHead"><div><h2>Fichajes de hoy</h2><small style="color:var(--muted)">Una fila por persona.</small></div><button id="refreshPunch" class="btn">Actualizar</button></div><div class="list">'+people.map(o=>{let cls='warn',txt='Sin fichar',detail='';if(o.e&&o.e.started_at){cls='ok';txt='Fichado';detail=new Intl.DateTimeFormat('es-ES',{timeZone:'Europe/Madrid',hour:'2-digit',minute:'2-digit'}).format(new Date(o.e.started_at))}else if(o.e&&o.e.incident){cls='info';txt='Incidencia';detail=o.e.incident}return'<div class="row"><div><b>'+esc(o.p.full_name)+'</b><small>'+(o.p.role==='admin'?'Administrador':'Trabajador')+(detail?' · '+esc(detail):'')+'</small></div><span class="state '+cls+'">'+txt+'</span></div>'}).join('')+'</div>';$('#refreshPunch').onclick=()=>render('punches')}
function docState(x){const s=String(x.status||'');if(s==='expired')return['bad','Caducado'];if(s==='upcoming')return['warn','Próximo'];if(s==='pending')return['warn','Pendiente'];if(s==='not_required')return['info','No requerido'];return['ok','Vigente']}
async function renderCAE(){if(!caeData){const z=await v3('/docs/list');if(!z.ok)throw new Error(z.error||'No se pudo cargar CAE');caeData=z}drawCAE()}
function drawCAE(){const all=(caeData.items||[]).filter(x=>!String(x.document_code||'').startsWith('sys_'));const scoped=all.filter(x=>x.scope===caeScope);const f=scoped.filter(x=>caeFilter==='all'||x.status===caeFilter);$('#content').innerHTML='<div class="hero"><div><h1>CAE / PRL</h1><p>Consulta documental únicamente.</p></div><span class="pill">🔒 SOLO LECTURA</span></div><div class="notice">Aquí no se puede añadir, sustituir, editar, borrar ni cambiar requisitos.</div><div class="toolbar"><button class="btn '+(caeScope==='employee'?'primary':'')+'" data-scope="employee">Empleados</button><button class="btn '+(caeScope==='company'?'primary':'')+'" data-scope="company">Empresa</button><button id="caeRefresh" class="btn">Actualizar</button></div><div class="toolbar"><button class="btn '+(caeFilter==='all'?'primary':'')+'" data-filter="all">Todos</button><button class="btn '+(caeFilter==='pending'?'primary':'')+'" data-filter="pending">Pendientes</button><button class="btn '+(caeFilter==='expired'?'primary':'')+'" data-filter="expired">Caducados</button><button class="btn '+(caeFilter==='upcoming'?'primary':'')+'" data-filter="upcoming">Próximos 30 días</button></div><div class="docGrid">'+(f.map(x=>{const st=docState(x);return'<div class="card"><div style="display:flex;justify-content:space-between;gap:8px"><div><div class="docName">'+esc(x.document_name||x.type_name||x.original_name||'Documento')+'</div><div class="docMeta"><span>'+esc(x.owner_name||'')+'</span><span>'+esc(x.category||'')+'</span><span>'+(x.expiry_date?'Caduca: '+esc(String(x.expiry_date).slice(0,10)):'Sin caducidad indicada')+'</span></div></div><span class="state '+st[0]+'">'+st[1]+'</span></div><div class="docActions">'+(x.file_id?'<button class="btn" data-open="'+x.file_id+'">Abrir</button><button class="btn" data-down="'+x.file_id+'">Descargar</button>':'<span style="color:var(--muted);font-size:11px">Sin archivo adjunto</span>')+'</div></div>'}).join('')||'<div class="card empty">No hay documentos en este filtro.</div>')+'</div>';$$('[data-scope]').forEach(b=>b.onclick=()=>{caeScope=b.dataset.scope;drawCAE()});$$('[data-filter]').forEach(b=>b.onclick=()=>{caeFilter=b.dataset.filter;drawCAE()});$$('[data-open]').forEach(b=>b.onclick=()=>openDoc(b.dataset.open,false));$$('[data-down]').forEach(b=>b.onclick=()=>openDoc(b.dataset.down,true));$('#caeRefresh').onclick=async()=>{caeData=null;await render('cae')}}
async function openDoc(id,download){const z=await v3('/docs/url',{file_id:id,download:download});if(!z.ok){alert(z.error||'No se pudo abrir');return}window.open(z.url,'_blank','noopener')}
function renderStub(p){const x=titles[p]||[p,''];$('#content').innerHTML='<div class="hero"><div><h1>'+esc(x[0])+'</h1><p>'+esc(x[1])+'</p></div><span class="pill">MENÚ SEPARADO</span></div><div class="card"><b>Este apartado ya está separado del resto.</b><p style="color:var(--muted);line-height:1.5">Primero estamos validando la navegación y el tamaño. Después conectaremos aquí las funciones completas del gestor Windows.</p></div>'}
$('#loginBtn').addEventListener('click',login);$('#pin').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('#logout').addEventListener('click',logout);$$('[data-page]').forEach(b=>b.addEventListener('click',()=>render(b.dataset.page)));$('#hamb').addEventListener('click',()=>{$('#sidebar').classList.add('open');$('#shade').classList.add('open')});$('#shade').addEventListener('click',closeMenu);boot();
})();
</script>
</body>
</html>
